    S.market.length ? `<div style="font-size:var(--f-sm);font-weight:800;color:var(--text-3)">${t('market_ask')}: <b style="color:var(--text)">${fmt(Math.min.apply(null, S.market.map(l => l.askPrice)))}</b></div>` : '');
  const s = currentSeason();
  html += `<div class="season-indicator"><span class="season-ico">${ico(['snow', 'flower', 'sun', 'leaf'][SEASONS.indexOf(s)] || 'sun')}</span> <b>${nm(s.name)}</b> · ${t('season_tech')} ×${s.mods.tech.toFixed(2)} · ${t('season_sport')} ×${s.mods.sport.toFixed(2)}</div>`;
  if (S.dailyDemand) html += `<div class="season-indicator">🔥 ${t('tag_demand')}: ${t('filter_' + S.dailyDemand.cat)} ×${S.dailyDemand.mult.toFixed(2)}</div>`;
  if (S.showTutorial && S.onboardingStep === 0) {
    html += `<div class="tutorial-card"><div class="tutorial-title">${t('how_play')}</div><div class="tutorial-steps"><span>1</span>${t('step_inspect')}<br><span>2</span>${t('step_trade')}<br><span>3</span>${t('step_sell')}<br><span>4</span>${t('step_goal')}</div><button class="btn-primary btn-sm" onclick="hideTutorial()">${t('start_btn')}</button></div>`;
  }
  if (S.onboardingStep === 1 && S.market.length > 0) html += `<div class="onboarding-tip"><span class="arrow">👇</span> ${t('tip_inspect')}</div>`;
  else if (S.onboardingStep === 2) html += `<div class="onboarding-tip"><span class="arrow">💬</span> ${t('tip_write')}</div>`;

  html += renderGoalCard();
  if (S.storyQuest && !S.storyDone) html += renderStoryCard();

  if (S.auction && S.auction.active) {
    html += `<div class="auction-card"><div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-weight:900;font-size:16px;">${t('auction_head')}</span></div><div style="display:flex;gap:10px;align-items:center;"><div style="width:52px;height:52px;background:rgba(255,255,255,0.25);border-radius:14px;display:grid;place-items:center;">${getIconHtml(S.auction.item)}</div><div><div style="font-weight:800;font-size:15px;">${itemName(S.auction.item)}</div><div style="font-size:12px;opacity:0.9;">${t('auction_bid')}: ${fmt(S.auction.currentBid)}</div></div></div><button class="auction-btn" onclick="startAuction()">${t('auction_join')}</button></div>`;
  }

  html += renderTrends();
  /* тулбар — прямо перед товарами; он же липнет к верху при прокрутке */
  html += renderToolbar();
  html += `<div class="result-count" id="resultCount">📊 ${t('found_label')}: <b>${mLots}</b> ${plural(mLots, t('lot1'), t('lot2'), t('lot5'))}</div>`;
  html += `<div id="hostMarket"></div>`;
  if (S.market.length >= MARKET_MAX) html += `<div class="lock-note">${t('market_limit')}</div>`;
  html += `<button class="btn-primary btn-full" style="margin-top:8px" onclick="nextDay()">${t('btn_next_day')}<span style="opacity:.7;font-weight:400;font-size:12px;margin-left:6px">${t('next_day_rent', { r: fmt(rentCost()) })}</span></button>`;
  return html;
}

function renderInvCard(it) {
  const storeCap = storageLimit();
  const known = isKnown(it);
  const orderMatch = S.orders.find(o => !o.done && !o.failed && o.itemId === it.itemId && !it.defect);
  const profit = it.trueValue - it.askPrice;
  const tags = [];
  if (known && it.defect) tags.push(`<span class="tag tag-defect">${ico('alert')}${t('tag_defect')}</span>`);
  if (it.isBlack) tags.push(`<span class="tag tag-black">${ico('moon')}${t('tag_black')}</span>`);
  if (orderMatch) tags.push(`<span class="tag tag-order">${ico('list')}${fmt(orderMatch.reward)}</span>`);
  if (known && profit > 0 && !it.defect) tags.push(`<span class="tag tag-profit">${ico('coin')}+${fmt(profit)}</span>`);
  const restoreCost = round100(it.marketValue * (1 - it.condition) * 0.5);
  const canRestore = it.condition < 0.99 && S.money >= restoreCost;
  const canStore = storeCap > 0 && S.storage.length < storeCap;
  const shown = known ? it.trueValue : (it.estimate || it.marketValue || 0);
  return `<div class="card"><div class="card-top"><div class="emoji-box ${it.cat}${iconBroken(it) ? ' no-img' : ''}" data-fb="${it.emoji}">${getIconHtml(it)}</div><div class="info"><div class="name">${itemName(it)}</div><div class="cond">${Math.round(it.condition * 100)}% ${t('inv_state')}</div>${tags.length ? `<div class="tags-row">${tags.join('')}</div>` : ''}</div></div><div class="rows"><div class="row"><span>${t('inv_bought')}</span><b>${fmt(it.askPrice)}</b></div><div class="row"><span>${known ? t('market_real') : t('market_est')}</span><b class="${shown > it.askPrice ? 'good' : 'bad'}">${known ? '' : '~'}${fmt(shown)}</b></div></div><div class="actions">${it.condition < 0.99 ? `<button class="btn-ghost wide" data-act="restore" data-id="${it.id}" ${canRestore ? '' : 'disabled'} style="color:var(--primary);border:1px solid var(--primary)">${ico('sparkle')}${t('btn_restore')} · ${fmt(restoreCost)}</button>` : ''}${it.defect ? `<button data-act="repair" data-id="${it.id}">${ico('wrench')}${t('btn_repair')}</button>` : ''}${storeCap > 0 ? `<button class="btn-ghost store-btn" data-act="store" data-id="${it.id}" ${canStore ? '' : 'disabled'}>${ico('box')}<span>${t('btn_store')}</span><span class="armed-lbl"></span></button>` : ''}<button class="btn-sell" data-act="sell" data-id="${it.id}">${ico('message')}${t('btn_sell')}</button><button class="btn-ghost quicksell-btn" data-act="quicksell" data-id="${it.id}">${ico('bolt')}<span>${t('quick_sell')}</span><span class="armed-lbl"></span></button></div></div>`;
}
function renderStorageCard(it) {
  return `<div class="card"><div class="card-top"><div class="emoji-box ${it.cat}${iconBroken(it) ? ' no-img' : ''}" data-fb="${it.emoji}">${getIconHtml(it)}</div><div class="info"><div class="name">${itemName(it)}</div><div class="cond">${Math.round(it.condition * 100)}% ${t('inv_state')}</div></div></div><button class="btn-ghost" data-act="unstore" data-id="${it.id}" ${S.inv.length >= invLimit() ? 'disabled' : ''}>${t('btn_unstore')}</button></div>`;
}
function renderInv() {
  let html = '';
  const slots = invLimit();
  const storeCap = storageLimit();
  html += panelHeader('bag', t('inv_title'),
    `${S.inv.length}/${slots}${storeCap ? ' · ' + t('storage_title') + ' ' + S.storage.length + '/' + storeCap : ''}`,
    S.inv.length ? `<div style="font-size:var(--f-sm);font-weight:800;color:var(--text-3)">${t('market_real')}: <b style="color:var(--green)">${fmt(S.inv.reduce((s, i) => s + i.trueValue, 0))}</b></div>` : '');
  html += `<div class="section-title">${t('inv_title')} ${S.inv.length}/${slots}</div>`;
  if (S.onboardingStep === 3 && S.inv.length > 0) html += `<div class="onboarding-tip"><span class="arrow">💬</span> ${t('tip_sell')}</div>`;
  if (!S.inv.length) html += `<div class="empty">${t('inv_empty')}</div>`;
  else html += `<div id="hostInv"></div>`;
  if (storeCap > 0) {
    html += `<div class="section-title">${t('storage_title')} ${S.storage.length}/${storeCap}</div>`;
    if (!S.storage.length) html += `<div class="empty">${t('storage_empty')}</div>`;
    else html += `<div id="hostStorage"></div>`;
    const inc = storageIncome();
    if (inc) html += `<div class="lock-note">${t('storage_income', { n: fmt(inc) })}</div>`;
  }
  return html;
}

function renderOrderCard(o) {
  const daysLeft = o.deadline - S.day;
  const urgent = daysLeft <= 1;
  const hasItem = S.inv.find(i => i.itemId === o.itemId && !i.defect);
  return `<div class="card ${urgent ? 'urgent' : ''}"><div class="card-top"><div class="emoji-box${iconBroken(o) ? ' no-img' : ''}" style="background:var(--surface-2)" data-fb="${o.emoji}">${getIconHtml(o)}</div><div class="info"><div class="name">${itemName(o)}</div><div class="cond" style="color:${urgent ? 'var(--red)' : 'var(--text-3)'}">${urgent ? t('order_urgent') + ' · ' : ''}${t('order_left', { n: daysLeft })}</div></div></div><div class="rows"><div class="row"><span>${t('order_reward')}</span><b class="good">${fmt(o.reward)}</b></div><div class="row"><span>${t('order_bonus')}</span><b class="warn">+${o.bonus}%</b></div></div><button class="btn-buy" data-act="order" data-id="${o.id}" ${hasItem ? '' : 'disabled'}>${ico('check')}${hasItem ? t('btn_order') : t('order_need_item')}</button></div>`;
}
function renderOrders() {
  let html = '';
  const actN = S.orders.filter(o => !o.done && !o.failed).length;
  html += panelHeader('clipboard', t('orders_title'),
    `${actN} · ${t('quests_title')}: ${(S.quests || []).length}`,
    `<div style="font-size:var(--f-sm);font-weight:800;color:var(--text-3)">${t('st_earned')}: <b style="color:var(--green)">${fmt(S.stats.totalEarned)}</b></div>`);
  html += `<div class="section-title">${t('quests_title')}</div>`;
  if (!S.quests || !S.quests.length) html += `<div class="empty">${t('quests_empty')}</div>`;
  else html += S.quests.map(q => `<div class="quest-item ${q.claimed ? 'done' : ''}"><div><div class="quest-text">${q.text}</div><div style="font-size:11px;color:var(--text-3);margin-top:2px;">${q.current} / ${q.target}</div></div><div class="quest-reward">+${fmt(q.reward)}</div></div>`).join('');
  const active = S.orders.filter(o => !o.done && !o.failed);
  html += `<div class="section-title">${t('orders_title')}</div>`;
  if (!active.length) html += `<div class="empty">${t('order_no_items')}</div>`;
  else html += `<div id="hostOrders"></div>`;
  return html;
}

function renderBiz() {
  let html = '';
  const lvl = bizLevel(), bl = BUSINESS_LEVELS[lvl], next = BUSINESS_LEVELS[lvl + 1];
  html += panelHeader('chart', t('biz_title'),
    `${nm(bl.name)} · ${t('biz_level')}: ${lvl + 1}/${BUSINESS_LEVELS.length}`,
    `<div style="font-size:var(--f-sm);font-weight:800;color:var(--text-3)">${t('money_label')}: <b style="color:var(--text)">${fmt(S.money)}</b></div>`);
  html += `<div class="rank-card"><div class="rank-emoji"><span class="level-ico">${ico(['store', 'tent', 'shop', 'chain', 'building'][lvl] || 'store')}</span></div><div class="rank-name">${nm(bl.name)}</div><div class="rank-desc">${next ? t('biz_until', { n: nm(next.name), m: fmt(Math.max(0, next.min - S.maxMoney)) }) : t('max_reached')}</div><div class="level-bar">${BUSINESS_LEVELS.map((_, i) => `<div class="level-seg ${i <= lvl ? 'on' : ''}"></div>`).join('')}</div></div>`;
  html += renderGoalCard();
  html += `<div class="section-title">${t('transport_title')}</div>`;
  const nextT = S.transport + 1;
  if (nextT < TRANSPORTS.length) {
    const tr = TRANSPORTS[nextT];
    const canBuy = S.money >= tr.cost && bizLevel() >= tr.reqLevel;
    const reason = bizLevel() < tr.reqLevel ? t('need_biz', { n: nm(BUSINESS_LEVELS[tr.reqLevel].name) }) : (S.money < tr.cost ? t('no_money') : '');
    html += `<div class="card"><div class="card-top"><div class="emoji-box" style="background:var(--primary-soft)">${ico(['walk', 'car', 'van', 'truck'][nextT - 1] || 'car')}</div><div class="info"><div class="name">${nm(tr.name)}</div><div class="cond">${nm(tr.desc)}</div></div></div><div class="row"><span>${t('price_label')}</span><b>${fmt(tr.cost)}</b></div><button class="btn-buy" data-act="transport" data-id="${nextT}" ${canBuy ? '' : 'disabled'}>${canBuy ? t('buy_btn') : (reason || t('unavailable'))}</button></div>`;
  } else html += `<div class="card"><div class="card-top"><div class="emoji-box" style="background:var(--green-soft)">${TRANSPORTS[S.transport].emoji}</div><div class="info"><div class="name">${nm(TRANSPORTS[S.transport].name)}</div><div class="cond">✓ ${t('max_reached')}</div></div></div></div>`;

  if (S.pallet && S.transport >= 3) {
    const p = S.pallet;
    const can = S.money >= p.price && S.inv.length + p.size <= invLimit();
    html += `<div class="card"><div class="card-top"><div class="emoji-box" style="background:var(--green-soft)">${ico('box')}</div><div class="info"><div class="name">${t('pallet_title', { n: p.size })}</div><div class="cond">${t('pallet_desc')}</div></div></div><div class="row"><span>${t('price_label')}</span><b>${fmt(p.price)}</b></div><button class="btn-buy btn-full" data-act="pallet" ${can ? '' : 'disabled'}>${can ? t('buy_btn') : (S.money < p.price ? t('no_money') : t('no_space'))}</button></div>`;
  }

  html += `<div class="section-title">${t('skills_title')} · ${t('sp_label', { n: S.skillPoints })}</div>`;
  for (const [id, sk] of Object.entries(SKILLS)) {
    const lvlS = S.skills[id];
    html += `<div class="skill-branch"><div class="skill-head"><span class="btn-ico">${ico(SKILL_ICON[sk.emoji] || 'star')}</span> ${nm(sk.name)}</div><div class="skill-nodes">${sk.levels.map((desc, i) => { const active = i < lvlS; const isNext = i === lvlS && S.skillPoints > 0; return `<div class="skill-node ${active ? 'active' : ''} ${isNext ? 'next' : ''}" ${isNext ? `data-act="skill" data-id="${id}"` : ''}><span class="lvl">${active ? '✓' : (i + 1)}</span><span class="lbl">${nm(desc)}</span></div>`; }).join('')}</div></div>`;
  }

  html += `<div class="section-title">${t('upgrades_title')}</div>`;
  for (const [id, u] of Object.entries(UPGRADES)) {
    const leveled = !!u.levels;
    const lvlU = leveled ? (S.up[id] || 0) : (S.up[id] ? 1 : 0);
    const maxed = leveled ? lvlU >= u.levels.length : !!S.up[id];
    const cost = leveled ? (u.levels[lvlU] ? u.levels[lvlU].cost : 0) : u.cost;
    const desc = leveled ? (u.levels[lvlU] ? `${u.base} → ${u.levels[lvlU].desc}` : t('max_reached')) : nm(u.desc);
    const can = !maxed && S.money >= cost;
    html += `<div class="card"><div class="card-top"><div class="emoji-box" style="background:var(--primary-soft)">${u.emoji}</div><div class="info"><div class="name">${nm(u.name)}</div><div class="cond">${desc}</div></div></div>${leveled ? `<div class="row"><span>${t('lvl_label')}</span><b>${lvlU} / ${u.levels.length}</b></div>` : ''}<button class="btn-buy" data-act="upgrade" data-id="${id}" ${maxed || !can ? 'disabled' : ''}>${maxed ? t('max_level') : (can ? t('buy_cost', { n: fmt(cost) }) : t('not_enough', { n: fmt(cost) }))}</button></div>`;
  }

  const creditMax = creditLimit();
  html += `<div class="section-title">${t('credit_title')}</div>`;
  html += `<div class="card"><div class="rows"><div class="row"><span>${t('credit_limit')}</span><b>${fmt(creditMax)}</b></div><div class="row"><span>${t('credit_debt')}</span><b class="${S.credit > 0 ? 'bad' : 'good'}">${fmt(S.credit)}</b></div><div class="row"><span>${t('credit_rate')}</span><b class="warn">${fmt(creditInterest())} / ${t('per_day').toLowerCase()}</b></div></div><div class="actions"><button class="btn-ghost" data-act="takeCredit" ${S.credit >= creditMax ? 'disabled' : ''}>${t('credit_take')}</button><button class="btn-danger" data-act="payCredit" ${S.credit > 0 ? '' : 'disabled'}>${t('credit_pay')}</button></div></div>`;

  const nextA = ASSISTANTS.find(a => a.level === S.assistant + 1);
  html += `<div class="section-title">${t('assistant_title')}</div>`;
  if (S.assistant > 0) {
    const cur = ASSISTANTS.find(a => a.level === S.assistant);
    html += `<div class="card assistant-card"><div class="card-top"><div class="emoji-box" style="background:var(--green-soft)">${ico('user')}</div><div class="info"><div class="name">${nm(cur.name)}</div><div class="cond">${t('assistant_level', { n: cur.level })} · ${t('assistant_desc')}</div></div></div><div class="row"><span>${t('assistant_fee')}</span><b>${Math.round(cur.fee * 100)}%</b></div><div class="row"><span>${t('assistant_sells')}</span><b>${cur.sells}</b></div></div>`;
  }
  if (nextA) {
    const canA = S.money >= nextA.cost;
    html += `<div class="card"><div class="card-top"><div class="emoji-box" style="background:var(--primary-soft)">${ico('user')}</div><div class="info"><div class="name">${nm(nextA.name)}</div><div class="cond">${t('assistant_desc')}</div></div></div><div class="row"><span>${t('price_label')}</span><b>${fmt(nextA.cost)}</b></div><button class="btn-buy" data-act="assistant" data-id="${nextA.level}" ${canA ? '' : 'disabled'}>${canA ? t('assistant_hire') : t('not_enough', { n: fmt(nextA.cost) })}</button></div>`;
  }
  return html;
}

function renderBlack() {
  const bh = panelHeader('moon', t('black_title'), `${(S.blackMarket || []).length} ${t('lot1')}`, '');
  if (!repHas('black')) return bh + `<div class="lock-note">${t('black_locked', { n: 75 })}</div>`;
  let html = bh + `<div class="lock-note">${t('black_warn')}</div>`;
  const lots = S.blackMarket || [];
  if (!lots.length) return html + `<div class="empty">${t('market_none')}</div>`;
  const invFull = S.inv.length >= invLimit();
  html += lots.map(it => {
    const canBuy = S.money >= it.askPrice && !invFull;
    const diff = it.estimate - it.askPrice;
    return `<div class="card black-card"><div class="card-top"><div class="emoji-box ${it.cat}">${getIconHtml(it)}</div><div class="info"><div class="name">${itemName(it)}</div><div class="cond">${Math.round(it.condition * 100)}%</div><div class="tags-row"><span class="tag tag-black">${t('black_risk')} ${it.risk}%</span><span class="tag tag-demand">${t('market_pot')} +${fmt(Math.max(0, diff))}</span></div></div></div><div class="rows"><div class="row"><span>${t('market_ask')}</span><b>${fmt(it.askPrice)}</b></div><div class="row"><span>${t('market_est')}</span><b class="good">~${fmt(it.estimate)}</b></div></div><button class="btn-buy" data-act="blackbuy" data-id="${it.id}" ${canBuy ? '' : 'disabled'}>${canBuy ? t('btn_buy') : (invFull ? t('no_space') : t('no_money'))}</button></div>`;
  }).join('');
  return html;
}
function renderProfile() {
  const rank = [...RANKS].reverse().find(r => S.rep >= r.min) || RANKS[0];
  const st = S.stats;
  const tier = repTier();
  const nextTier = REP_TIERS.find(r => r.min > S.rep);
  const repPct = nextTier ? Math.min(100, Math.max(0, Math.round((S.rep - tier.min) / Math.max(1, nextTier.min - tier.min) * 100))) : 100;

  let html = panelHeader('user', t('profile_title'), `${nm(rank.name)} · ${t('rep_label')} ${Math.round(S.rep)}/100`, `<div style="font-size:var(--f-sm);font-weight:800;color:var(--text-3)">${t('rec_prestige')}: <b style="color:var(--purple)">${S.prestige}</b></div>`);
  html += `<div class="rank-card"><div class="prestige-badge">Prestige ${S.prestige} (×${prestigeMult().toFixed(1)})</div><div class="rank-emoji"><span class="level-ico">${ico(RANK_ICON[rank.emoji] || 'medal')}</span></div><div class="rank-name">${nm(rank.name)}</div><div class="rank-desc">${nm(rank.desc)} · ${t('rep_label')} ${Math.round(S.rep)}/100</div></div>`;

  /* ── Репутация ── */
  html += `<div class="section-title">${t('rep_title')}</div>`;
  html += `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="rep-tier"><span class="btn-ico">${ico(REP_ICON[tier.emoji] || 'medal')}</span>${nm(tier.name)}</span><b style="font-variant-numeric:tabular-nums">${Math.round(S.rep)} / 100</b></div><div class="goal-bar"><div style="width:${repPct}%"></div></div><div style="font-size:var(--f-sm);color:var(--text-3);font-weight:700">${nextTier ? t('rep_next', { n: nm(nextTier.name) }) + ' · ' + t('rep_progress', { n: Math.ceil(nextTier.min - S.rep) }) : t('max_reached')}</div><div style="font-size:var(--f-sm);color:var(--text-2);font-weight:700;margin-top:4px">${t('rep_unlocks', { n: tier.unlocks.length ? tier.unlocks.map(u => t('rep_unlock_' + u)).join(', ') : '—' })}</div></div>`;

  /* ── Устройство ── */
  html += `<div class="section-title">${t('dev_title')}</div>`;
  html += `<div class="card"><div class="device-switch"><button class="device-btn ${S.device === 'phone' ? 'active' : ''}" data-act="device" data-id="phone"><span class="dev-ico" data-icon="phone"></span><span>${t('dev_phone')}</span></button><button class="device-btn ${S.device === 'desktop' ? 'active' : ''}" data-act="device" data-id="desktop"><span class="dev-ico" data-icon="monitor"></span><span>${t('dev_desktop')}</span></button></div></div>`;

  /* ── Статистика ── */
  html += `<div class="section-title">${t('stats_title')}</div>`;
  html += `<div class="stat-grid">
    <div class="stat-mini"><span class="l">${t('st_earned')}</span><span class="v" style="color:var(--green)">${fmt(st.totalEarned)}</span></div>
    <div class="stat-mini"><span class="l">${t('st_spent')}</span><span class="v" style="color:var(--red)">${fmt(st.totalSpent)}</span></div>
    <div class="stat-mini"><span class="l">${t('st_deals')}</span><span class="v">${st.deals}</span></div>
    <div class="stat-mini"><span class="l">${t('st_best')}</span><span class="v" style="color:var(--yellow)">${fmt(st.bestDeal)}</span></div>
    <div class="stat-mini"><span class="l">${t('rec_items_bought')}</span><span class="v">${st.itemsBought}</span></div>
    <div class="stat-mini"><span class="l">${t('rec_defects')}</span><span class="v" style="color:var(--red)">${st.defectsFound}</span></div>
    <div class="stat-mini"><span class="l">${t('rec_repaired')}</span><span class="v" style="color:var(--green)">${st.repairsDone}</span></div>
    <div class="stat-mini"><span class="l">${t('rec_orders')}</span><span class="v">${st.ordersDone}</span></div>
  </div>`;

  /* ── Журнал действий ── */

}
function restoreItem(id) {

function startAuction() {
  if (!S.auction || auctionActive) return;
  const a = S.auction;
  let current = a.currentBid, timer = 15, botWait = false, playerBid = false, finished = false, intervalId = null, sheetShown = false;
  auctionActive = true;
  const endWin = () => {
    if (finished) return; finished = true;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    auctionActive = false;
    if (!S.auction) return;
    if (S.inv.length >= invLimit()) { toast(t('no_space') + ' — ' + t('auction_lost'), 'error'); S.auction = null; closeSheet(); render(); return; }
    if (S.money < current) { toast(t('no_money'), 'error'); S.auction = null; closeSheet(); render(); return; }
    S.money -= current; S.stats.totalSpent += current; S.stats.itemsBought++;
    a.item.askPrice = current; S.inv.push(a.item); S.auction = null;
    closeSheet(); showConfetti(30); flyCoins(8); render();
    showAlert(t('auction_won'), `${fmt(current)}`, '🎉'); playSound('buy');
  };
  const endLose = (reason) => {
    if (finished) return; finished = true;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    auctionActive = false; S.auction = null; closeSheet(); render();
    if (reason) toast(reason, 'error');
  };
  const updateAuction = () => {
    if (finished) return;
    /* если окно аукциона закрыли/заменили — таймер останавливаем */
    if (sheetShown && !document.querySelector('.auction-sheet')) {
      if (intervalId) { clearInterval(intervalId); intervalId = null; }
      finished = true; auctionActive = false;
      return;
    }
    const can1000 = S.money >= current + 1000;
    const can5000 = S.money >= current + 5000;
    const can10000 = S.money >= current + 10000;
    /* разметка строится один раз, дальше меняются только цифры и кнопки —
       иначе весь лист перерисовывался каждую секунду и "мигал" */
    const bidEl = $('auctionBid'), timeEl = $('auctionTimer');
    if (!bidEl || !timeEl) { sheetShown = false; return; }
    bidEl.textContent = fmt(current);
    timeEl.textContent = t('auction_timer', { n: timer });
    const b1000 = $('auctionBid1000'), b5000 = $('auctionBid5000'), b10000 = $('auctionBid10000');
    if (b1000) b1000.disabled = timer <= 0 || botWait || !can1000;
    if (b5000) b5000.disabled = timer <= 0 || botWait || !can5000;
    if (b10000) b10000.disabled = timer <= 0 || botWait || !can10000;
  };
  const buildAuctionSheet = () => {
    showSheet(`<div class="drag-handle auction-sheet"><h2>${t('auction_head')}</h2><div style="text-align:center;padding:10px 0;"><div style="width:80px;height:80px;margin:0 auto 10px;background:var(--surface-2);border-radius:20px;display:grid;place-items:center;">${getIconHtml(a.item)}</div><div style="font-weight:900;font-size:18px;margin-bottom:4px;">${itemName(a.item)}</div></div><div style="background:var(--surface-2);padding:16px;border-radius:16px;text-align:center;"><div style="font-size:12px;color:var(--text-3);font-weight:800;text-transform:uppercase;">${t('auction_bid')}</div><div style="font-size:36px;font-weight:900;color:var(--primary);margin:8px 0;" id="auctionBid">${fmt(current)}</div><div style="font-size:13px;font-weight:800;color:var(--red);" id="auctionTimer">${t('auction_timer', { n: timer })}</div></div><div class="actions" style="display:grid;grid-template-columns:1fr 1fr;"><button class="btn-primary" id="auctionBid1000" onclick="bidAuction(1000)">+1000</button><button class="btn-primary" id="auctionBid5000" onclick="bidAuction(5000)">+5000</button></div><div class="actions" style="display:grid;grid-template-columns:1fr;"><button class="btn-primary" id="auctionBid10000" onclick="bidAuction(10000)">+10000</button></div><button class="btn-ghost btn-full" onclick="abortAuction()">${t('auction_leave')}</button>`);
    sheetShown = true;
  };
  window.bidAuction = (amount) => {
    if (finished || timer <= 0 || botWait) return;
    if (S.money < current + amount) { toast(t('no_money'), 'error'); return; }
    current += amount; playerBid = true; playSound('click');
    timer = Math.max(timer, 5); botWait = true; updateAuction();
    setTimeout(() => {
      if (finished) return;
      if (current >= a.botMax) { endWin(); }
      else { current += (Math.random() < 0.5 ? 1000 : 2000); botWait = false; timer = Math.max(timer, 5); updateAuction(); playSound('error'); }
    }, 1500 + Math.random() * 1000);
  };
  window.abortAuction = () => endLose(t('auction_leave'));
  intervalId = setInterval(() => {
    if (finished) { clearInterval(intervalId); intervalId = null; return; }
    timer--; updateAuction();
    if (timer <= 0) {
      clearInterval(intervalId); intervalId = null;
      setTimeout(() => { if (finished) return; if (playerBid && !botWait) endWin(); else endLose(t('auction_lost')); }, 800);
    }
  }, 1000);
  buildAuctionSheet();
  updateAuction();
}

function startBuyChat(itemId) {
  if (chat) return;
  const it = S.market.find(x => x.id === itemId);
  if (!it) return;
  if (S.inv.length >= invLimit()) { toast(t('no_space'), 'error'); return; }
  if (S.money < it.askPrice * 0.7) { toast(t('no_money'), 'error'); return; }
  let sellerType = pick(SELLER_TYPES);
  if (it.isBlack) sellerType = SELLER_TYPES.find(t => t.id === 'greedy');
  chat = { type: 'buy', item: it, seller: sellerType, currentPrice: it.askPrice, minPrice: round100(it.askPrice * (1 - sellerType.maxDiscount)), patience: sellerType.patience, messages: [{ from: 'other', text: t('msg_hello_sell', { n: fmt(it.askPrice) }) }], completed: false, abandoned: false, keyboardOpen: false, keyboardValue: '', pending: false };
  playSound('message'); renderChat();
}
function startSellChat(itemId) {
  const it = S.inv.find(x => x.id === itemId);
  if (!it || chat) return;
  let buyer, isNpc = false;
  if (Math.random() < 0.4) { const npc = pick(NPCS); let priceMult = 1.0; if (npc.cat === it.cat) priceMult = 1.25; else priceMult = 0.85; buyer = { id: npc.id, emoji: npc.emoji, name: npc.name, info: npc.info, priceMult, maxRaises: 1, raiseFactor: 1.1, isNpc: true }; isNpc = true; }
  else buyer = pick(BUYERS);
  let repMult = 0.9 + S.rep / 500;
  if (S.up.vip) repMult += 0.1;
  if (S.skills.trade >= 1) repMult += 0.03;
  if (S.skills.trade >= 2) repMult += 0.03;
  if (S.skills.trade >= 3) repMult += 0.04;
  const demandMult = (S.dailyDemand && it.cat === S.dailyDemand.cat) ? (S.dailyDemand.mult || 1.3) : 1;
  const eventMult = (S.event && S.event.effect === 'sellBoost' && S.event.cat === it.cat) ? S.event.mult : 1;
  const eventAll = (S.event && S.event.effect === 'sellBoostAll') ? S.event.mult : 1;
  let buyerPrice = it.trueValue * buyer.priceMult * repMult * demandMult * eventMult * eventAll * prestigeMult();
  if (buyer.detectsDefects && it.defect) buyerPrice *= 0.7;
  const maxPrice = round100(buyerPrice);
  const offer = round100(maxPrice * rnd(0.72, 0.9));
  chat = { type: 'sell', item: it, buyer, currentPrice: offer, maxPrice, raises: 0, maxRaises: buyer.maxRaises + (S.up.negotiation ? 1 : 0), messages: [{ from: 'other', text: isNpc ? t('msg_npc', { i: itemName(it), n: fmt(offer) }) : t('msg_hello_buy', { n: fmt(offer) }) }], completed: false, abandoned: false, keyboardOpen: false, keyboardValue: '', pending: false };
  playSound('message'); renderChat();
}

  if (c.completed) { const btnText = c.type === 'buy' ? `${t('chat_take')} ${fmt(c.currentPrice)}` : `${t('chat_give')} ${fmt(c.currentPrice)}`; const btnClass = c.type === 'buy' ? 'btn-buy' : 'btn-sell'; actionsHtml = `<button class="${btnClass} btn-full" onclick="finalizeChat()">${btnText}</button>`; }

  else { const p = c.currentPrice; const quick = QUICK_STEPS.map(s => `<button onclick="playerCounterSell(${p + s})">+${s}</button>`).join(''); actionsHtml = `<button class="btn-sell btn-full" onclick="playerAcceptSell(${p})" ${c.pending ? 'disabled' : ''}>${t('chat_give')} ${fmt(p)}</button><div class="quick-offers">${quick}</div><button class="btn-primary btn-full" onclick="openCustomKeyboard()">${t('chat_custom_price')}</button><button class="btn-ghost btn-sm" onclick="leaveChat()">${t('chat_leave')}</button>`; }
  const messagesClass = 'chat-messages' + (c.keyboardOpen ? ' compact' : '');
  showSheet(`<div class="drag-handle"></div><div class="chat-header"><div class="chat-avatar">${who.emoji}</div><div style="flex:1"><div class="chat-name">${title}</div><div class="chat-status ${c.abandoned ? 'offline' : ''}">${status}</div></div><div style="text-align:right;line-height:1.1"><div style="font-size:15px;font-weight:800;color:var(--text)">${fmt(c.currentPrice)}</div></div></div><div class="${messagesClass}" id="chatMessages">${messagesHtml}</div><div class="chat-actions">${actionsHtml}</div>`);
  requestAnimationFrame(() => { const box = $('chatMessages'); if (box) box.scrollTop = box.scrollHeight; });
}

function flyCardToInventory(lotId) {
  const btn = document.querySelector('.card [data-act="buy"][data-id="' + lotId + '"]');
  const card = btn ? btn.closest('.card') : null;
  const target = document.querySelector('.nav-btn[data-tab="inv"]');
  if (!card || !target) return;
  const a = card.getBoundingClientRect(), b = target.getBoundingClientRect();
  const clone = card.cloneNode(true);
  clone.classList.add('fly-card');
  clone.style.left = a.left + 'px';
  clone.style.top = a.top + 'px';
  clone.style.width = a.width + 'px';
  clone.style.height = a.height + 'px';
  clone.style.opacity = '0.95';
  document.body.appendChild(clone);
  requestAnimationFrame(() => {
    clone.style.transform = 'translate(' + (b.left + b.width / 2 - a.left - a.width / 2) + 'px,' + (b.top + b.height / 2 - a.top - a.height / 2) + 'px) scale(.12)';

function playerCounterSell(amount) {

const MG_ROUNDS = [{ speed: 0.30, shrink: 1.00 }, { speed: 0.45, shrink: 0.80 }, { speed: 0.60, shrink: 0.62 }];
function startRepairGame(itemId) { const it = S.inv.find(x => x.id === itemId); if (!it) return; if (repairGame) cancelAnimationFrame(repairGame.rafId); repairGame = { itemId, item: it, round: 0, totalRounds: 3, score: 0, perfect: 0, results: [], speed: 0.30, position: 50, direction: 1, goodMin: 15, goodMax: 85, perfMin: 30, perfMax: 70, running: false, rafId: null, lastResult: null }; setupRound(); renderRepairGame(); startRepairLoop(); }
/* зона берётся из стоимости товара и сужается с каждым раундом */
function setupRound() {
  const g = repairGame; if (!g) return;
  const r = MG_ROUNDS[g.round] || MG_ROUNDS[MG_ROUNDS.length - 1];
  const z = repairZones(g.item);
  const perfHalf = (z.perfMax - z.perfMin) / 2 * r.shrink;
  const goodHalf = (z.goodMax - z.goodMin) / 2 * r.shrink;
  Object.assign(g, {
    speed: r.speed,
    perfMin: 50 - perfHalf, perfMax: 50 + perfHalf,
    goodMin: 50 - goodHalf, goodMax: 50 + goodHalf,
    position: 50, direction: 1, running: true, lastResult: null

}
function startRepairLoop() {
  const g = repairGame; if (!g) return;
  const cursor = document.getElementById('mgCursor');
  let last = performance.now();
  const step = (now) => {
    if (!g || !g.running) return;
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    g.position += g.speed * 60 * dt * g.direction;
    if (g.position >= 100) { g.position = 100; g.direction = -1; } else if (g.position <= 0) { g.position = 0; g.direction = 1; }
    if (cursor) cursor.style.left = g.position + '%';

}

window.stopRepair = () => {

window.undoStore = undoStore;
function unstoreItem(id) { const it = S.storage.find(x => x.id === id); if (!it || S.inv.length >= invLimit()) return; S.storage = S.storage.filter(x => x.id !== id); delete it.storedDay; S.inv.push(it); render(); }
function takeCredit() { const limit = creditLimit(); if (S.credit >= limit) { toast(t('credit_limit'), 'error'); return; } const avail = limit - S.credit; showSheet(`<div class="drag-handle"></div><h2>💳 ${t('credit_title')}</h2><div class="hint">${t('credit_avail', { n: fmt(avail), r: 3 })}</div><input id="creditInput" type="number" placeholder="${t('credit_input_ph')}" inputmode="numeric" value="${Math.min(avail, 5000)}" style="padding:16px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-family:inherit;font-size:18px;font-weight:800;text-align:center;width:100%"><button class="btn-primary btn-full" onclick="confirmCredit()">${t('credit_take')}</button><button class="btn-ghost btn-full" onclick="closeSheet()">${t('cancel_btn')}</button>`); }
window.confirmCredit = () => { const inp = $('creditInput'); if (!inp) return; const limit = creditLimit(); const avail = limit - S.credit; const n = Math.max(0, Math.min(avail, Math.round(Number(inp.value || 0) / 100) * 100)); if (!n) { toast(t('msg_enter_amount'), 'error'); return; } S.credit += n; S.money += n; toast(`💳 +${fmt(n)}`, 'success'); checkRich(); closeSheet(); };
function payCredit() { if (S.credit <= 0 || S.money < S.credit) { toast(t('no_money'), 'error'); return; } showConfirm(t('pay_title', { n: fmt(S.credit) }), t('pay_warn'), () => { S.money -= S.credit; S.stats.totalSpent += S.credit; S.credit = 0; toast('💳 ' + t('ok_btn'), 'success'); render(); }); }
function resetGame() {
  showConfirm(t('reset_title'), t('reset_warn'), () => {
    const theme = S.theme, lang = S.lang, device = S.device, accent = S.accent, motion = S.motion;
    SafeStorage.remove(SAVE_KEY); SafeStorage.remove(SAVE_RAW_KEY);
    S = defaultState(); S.theme = theme; S.lang = lang; S.device = device; S.accent = accent; S.motion = motion;
    chat = null; repairGame = null; idc = 0;
    auctionActive = false;
    displayMoney = S.money;
    _cache.bizLevelKey = -1; _cache.invLimitKey = '';
    _fmCache = { key: '', items: [] };
    newMarket(); makeOrder(); generateQuests(); newGoal(); newStoryQuest();
    applyAllSettings();
    render();
    toast(t('msg_reset'), 'success');
  }, true);
}
function checkDailyBonus() {
  const today = new Date().toDateString();
  if (S.lastBonusDate === today) return;
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  S.dailyStreak = (S.lastBonusDate === yesterday) ? S.dailyStreak + 1 : 1;
  const bonus = Math.min(500 + (S.dailyStreak - 1) * 500, 5000);
  S.money += bonus; S.lastBonusDate = today;
  const b = document.createElement('div'); b.className = 'bonus-toast'; b.innerHTML = `${t('msg_bonus')}<br><div class="amt">+${fmt(bonus)}</div>${t('msg_bonus_day', { n: S.dailyStreak })}`;
  document.body.appendChild(b); setTimeout(() => b.remove(), 2800);
  haptic(50); showConfetti(20);
  checkRich();
  saveDebounced();
}
function nextDay() {
  if (chat || repairGame || auctionActive) return;
  S.day++;
  S.dayEarned = 0;
  const rent = rentCost();
  if (S.money < rent) { S.rep = Math.max(0, S.rep - 10); toast(t('msg_rent_warn'), 'error'); }
  S.money -= rent; S.stats.totalSpent += rent;
  if (S.credit > 0) S.credit += creditInterest();
  if (S.event) { S.event.daysLeft--; if (S.event.daysLeft <= 0) S.event = null; }
  else if (Math.random() < 0.35) { S.event = pick([{ id: 'tech_boom', emoji: '📈', text: { ru: 'Техника +20%', en: 'Tech +20%', es: 'Tecnología +20%' }, effect: 'sellBoost', cat: 'tech', mult: 1.20, daysLeft: 3 }, { id: 'vintage', emoji: '🎷', text: { ru: 'Винтаж +25%', en: 'Vintage +25%', es: 'Vintage +25%' }, effect: 'sellBoost', cat: 'hobby', mult: 1.25, daysLeft: 3 }, { id: 'sport', emoji: '🌞', text: { ru: 'Спорт +20%', en: 'Sport +20%', es: 'Deporte +20%' }, effect: 'sellBoost', cat: 'sport', mult: 1.20, daysLeft: 3 }, { id: 'inspect', emoji: '🔍', text: { ru: 'Осмотр бесплатный', en: 'Free inspection', es: 'Inspección gratis' }, effect: 'freeInspect', daysLeft: 3 }, { id: 'crash', emoji: '📉', text: { ru: 'Рынок −20%', en: 'Market −20%', es: 'Mercado −20%' }, effect: 'cheapMarket', mult: 0.80, daysLeft: 3 }, { id: 'frenzy', emoji: '🔥', text: { ru: 'Ажиотаж +15%', en: 'Frenzy +15%', es: 'Fiebre +15%' }, effect: 'sellBoostAll', mult: 1.15, daysLeft: 3 }, { id: 'tax', emoji: '🧾', text: { ru: 'Налоговая +800', en: 'Tax +800', es: 'Impuesto +800' }, effect: 'taxRaise', amount: 800, daysLeft: 3 }]); }
  newMarket(); generateQuests();
  if (!S.goal || S.goal.done || S.day > S.goal.endDay) newGoal();
  if (!S.storyQuest || S.storyDone) newStoryQuest();
  const inc = storageIncome();
  if (inc) { S.money += inc; S.stats.totalEarned += inc; }
  assistantSell();
  S.orders.forEach(o => { if (!o.done && !o.failed && S.day > o.deadline) { o.failed = true; S.rep = Math.max(0, S.rep - 5); } });
  /* архив: оставляем только 12 последних закрытых заказов */
  if (S.orders.length > 18) {
    const closed = S.orders.filter(o => o.done || o.failed);
    const open = S.orders.filter(o => !o.done && !o.failed);
    S.orders = open.concat(closed.slice(-12));
  }
  if (Math.random() < 0.55) makeOrder();
  if (Math.random() < 0.2) makeOrder();
  if (S.transport >= 3 && (!S.pallet || S.day - S.pallet.day >= 3)) { if (Math.random() < 0.6) makePallet(); }
  addXp(5);
  playSound('click'); haptic(10);
  checkRich();
  save();
  render();
}
function checkRich() { if (S.money >= TARGET_MONEY && !S.wasRich) { S.wasRich = true; setTimeout(() => { showAlert(t('rich_title'), t('rich_body', { m: fmt(S.money), d: S.day, s: S.stats.deals }), '🏆'); }, 400); } }
function exportSave() {
  const json = JSON.stringify(sanitizeState(S));
  const str = obfuscate(json) || btoa(unescape(encodeURIComponent(json)));
  showSheet(`<div class="drag-handle"></div><h2>${t('export_btn')}</h2><div class="hint">${t('export_hint')}</div><textarea class="sync-box" readonly onclick="this.select()">${str}</textarea><button class="btn-primary btn-full" onclick="closeSheet()">${t('ok_btn')}</button>`);
}
function importSave() { showSheet(`<div class="drag-handle"></div><h2>${t('import_btn')}</h2><div class="hint">${t('import_hint')}</div><textarea class="sync-box" id="importData" placeholder="${t('import_btn')}..."></textarea><button class="btn-danger btn-full" onclick="doImport()">${t('import_load')}</button><button class="btn-ghost btn-full" onclick="closeSheet()">${t('cancel_btn')}</button>`); }
window.doImport = () => {
  const val = $('importData').value.trim(); if (!val) return;
  let d = null;
  const candidates = [];
  const dec = deobfuscate(val);
  if (dec) candidates.push(dec);
  try { candidates.push(decodeURIComponent(escape(atob(val)))); } catch (e) {}
  for (const c of candidates) {
    try { const p = JSON.parse(c); if (p && typeof p.money === 'number' && p.stats) { d = p; break; } } catch (e) {}
  }
  if (!d) { toast(t('import_err'), 'error'); return; }
  try {
    S = { ...defaultState(), ...d };
    S.up = { ...defaultState().up, ...(d.up || {}) };
    S.stats = { ...defaultState().stats, ...(d.stats || {}) };
    S.skills = { ...defaultState().skills, ...(d.skills || {}) };
    S.achievements = (d.achievements && typeof d.achievements === 'object') ? d.achievements : {};
    if (!Array.isArray(S.market)) S.market = [];
    if (!Array.isArray(S.inv)) S.inv = [];
    if (!Array.isArray(S.storage)) S.storage = [];
    if (!Array.isArray(S.orders)) S.orders = [];
    if (!Array.isArray(S.quests)) S.quests = [];
    if (!Array.isArray(S.goalsDone)) S.goalsDone = [];
    if (!S.priceHistory || typeof S.priceHistory !== 'object') S.priceHistory = {};
    if (!Array.isArray(S.blackMarket)) S.blackMarket = [];
    S.device = S.device === 'desktop' ? 'desktop' : 'phone';
    S.motion = S.motion !== false;
    S.accent = ACCENTS[S.accent] ? S.accent : 'violet';
    _cache.bizLevelKey = -1; _cache.invLimitKey = '';
    _fmCache = { key: '', items: [] };
    const ids = [...S.market, ...S.inv, ...S.storage].map(x => (x && x.id) ? x.id : 0);
    idc = ids.length ? Math.max(...ids) : 0;
    displayMoney = S.money;
    auctionActive = false;
    save(true);
    closeSheet(); applyAllSettings(); render();
    showAlert('✅', t('import_ok'), '🎉');
  } catch(e) { toast(t('import_err'), 'error'); }
};


/* ═══════════════════════════════════════════════════════
   ОБРАБОТЧИКИ
   ═══════════════════════════════════════════════════════ */
$('modal').addEventListener('click', e => {
  if (e.target === $('modal') && !chat && !repairGame && !confirmCallback && !auctionActive) closeSheet();
});
/* обработчик делегирован на body: кнопки есть и в HUD, и в панелях */
document.body.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  /* защита от случайного нажатия — только для панелей (HUD не скроллится) */
  if (btn.closest('#appMain') && isScrollGesture()) { e.preventDefault(); e.stopPropagation(); return; }
  const id = btn.dataset.id, act = btn.dataset.act;
  if (act === 'inspect') inspectLot(+id);
  else if (act === 'restore') restoreItem(+id);
  else if (act === 'buy') startBuyChat(+id);
  else if (act === 'repair') repairItem(+id);
  else if (act === 'store') storeItem(+id);
  else if (act === 'unstore') unstoreItem(+id);
  else if (act === 'sell') startSellChat(+id);
  else if (act === 'order') completeOrder(+id);
  else if (act === 'upgrade') buyUpgrade(id);
  else if (act === 'transport') buyTransport(+id);
  else if (act === 'skill') buySkill(id);
  else if (act === 'pallet') buyPallet();
  else if (act === 'quickbuy') quickBuy(+id);
  else if (act === 'quicksell') quickSell(+id);
  else if (act === 'blackbuy') blackBuy(+id);
  else if (act === 'story') pickStory(id, +(btn.dataset.choice || 0));
  else if (act === 'assistant') buyAssistant(+id);
  else if (act === 'payCredit') payCredit();
  else if (act === 'takeCredit') takeCredit();
  else if (act === 'sound') { S.soundOn = !S.soundOn; playSound('click'); render(); }
  else if (act === 'music') { toggleMusic(); render(); }
  else if (act === 'haptic') { S.hapticOn = !S.hapticOn; haptic(30); render(); }
  else if (act === 'reset') resetGame();
  else if (act === 'device') setDevice(id);
  else if (act === 'motion') { S.motion = S.motion === false; applyMotion(); saveDebounced(); render(); }
  else if (act === 'accent') { S.accent = ACCENTS[id] ? id : 'violet'; applyAccent(); saveDebounced(); render(); }
  else if (act === 'filter') { S.filter = id; render(); }
  else if (act === 'sort') { S.sortBy = id; render(); }
});
const NAV_BTNS = Array.prototype.slice.call(document.querySelectorAll('.nav-btn'));
NAV_BTNS.forEach(btn => { btn.addEventListener('click', () => switchTab(btn.dataset.tab)); });
let _lastScrollAt = 0, _scrollPending = false;
$('appMain').addEventListener('scroll', () => {
  _lastScrollAt = Date.now();
  if (_scrollPending) return;
  _scrollPending = true;
  requestAnimationFrame(() => {
    _scrollPending = false;
    /* сначала читаем раскладку, потом пишем в DOM — иначе браузер
       пересчитывает раскладку дважды за кадр и прокрутка подтормаживает */
    const main = $('appMain');
    let p = 0;
    if (main) { const max = main.scrollHeight - main.clientHeight; p = max > 4 ? Math.min(1, main.scrollTop / max) : 0; }
    maybeLoadMore();
    updateScrollProgress(p);
  });
}, { passive: true });
function isScrollGesture() { return (Date.now() - _lastScrollAt) < 280; }
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  const rect = b.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const r = document.createElement('span');
  r.className = 'ripple';
  r.style.width = r.style.height = size + 'px';
  r.style.left = ((e.clientX || rect.left + rect.width / 2) - rect.left - size / 2) + 'px';
  r.style.top = ((e.clientY || rect.top + rect.height / 2) - rect.top - size / 2) + 'px';
  b.appendChild(r);
  setTimeout(() => r.remove(), 620);
}, { passive: true });
function updateScrollProgress(pct) {
  const bar = $('scrollBar');
  if (!bar) return;
  bar.style.width = (pct * 100).toFixed(2) + '%';
}
function moveNavPill(tab) {
  const pill = $('navPill');
  const btn = NAV_BTNS.find(b => b.dataset.tab === tab);
  if (!pill || !btn) return;
  pill.style.width = btn.offsetWidth + 'px';
  pill.style.transform = 'translateX(' + btn.offsetLeft + 'px)';
  pill.classList.add('on');
}
function switchTab(tab) {
  const tabs = ['market', 'inv', 'orders', 'biz', 'black', 'profile'];
  const oldIndex = tabs.indexOf(activeTab);
  const newIndex = tabs.indexOf(tab);
  NAV_BTNS.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  activeTab = tab;
  if (tab !== 'market') S.search = '';
  moveNavPill(tab);
  const main = $('appMain');
  if (main) main.scrollTop = 0;
  main.classList.remove('slide-left', 'slide-right');
  /* перезапуск анимации сдвига без принудительного reflow */
  main.getAnimations().forEach(a => { if (a.animationName === 'slideLeftIn' || a.animationName === 'slideRightIn') a.cancel(); });
  if (newIndex > oldIndex) main.classList.add('slide-left');
  else if (newIndex < oldIndex) main.classList.add('slide-right');
  playSound('click'); haptic(10); render();
}
let touchStart = null;
$('appMain').addEventListener('touchstart', e => { if (e.touches.length === 1) touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
$('appMain').addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  touchStart = null;
  if (Math.abs(dx) > 60 && Math.abs(dy) < 40) {
    const tabs = ['market', 'inv', 'orders', 'biz', 'black', 'profile'];
    let i = tabs.indexOf(activeTab);
    if (dx < 0) i = Math.min(tabs.length - 1, i + 1); else i = Math.max(0, i - 1);
    if (i !== tabs.indexOf(activeTab)) switchTab(tabs[i]);
  }
}, { passive: true });

window.startGame = () => { initAudio(); $('splash').classList.add('hidden'); if (!S.market.length) newMarket(); if (!S.quests.length) generateQuests(); render(); checkDailyBonus(); render(); if (S.musicOn) startMusic(); };

function init() {
  const loaded = load();
  applyAllSettings();
  paintStaticIcons();
  setTimeout(() => moveNavPill(activeTab), 60);
  if (!loaded) { newMarket(); makeOrder(); generateQuests(); }
  if (!S.market.length) newMarket();
  if (!S.quests || !S.quests.length) generateQuests();
  if (!S.goal) newGoal();
  if (!S.storyQuest) newStoryQuest();
  if (!loaded && !S.firstPlayed) {
    S.firstPlayed = true;
  } else {
    $('splash').classList.add('hidden');
    render();
    checkDailyBonus();
    render();
    if (loaded) setTimeout(() => toast(t('msg_loaded'), 'success'), 300);
  }
  save(true);
}
/* при изменении размера окна индикаторы сегментов и навигации «уезжают» — пересчитываем */
let _resizeTimer = null;
window.addEventListener('resize', () => {
  if (_resizeTimer) clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => { positionSegs(); moveNavPill(activeTab); }, 120);
});
init();
</script>
</body>
