<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08080c">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Reseller Simulator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  /* ═══════════ DESIGN TOKENS ═══════════ */
  :root {
    --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 20px;
    --r-xl: 22px; --r-2xl: 26px; --r-3xl: 32px; --r-full: 999px;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
    --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
    --f-xs: 10px; --f-sm: 11px; --f-base: 13px; --f-md: 14px;
    --f-lg: 15px; --f-xl: 17px; --f-2xl: 20px; --f-3xl: 28px;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  [data-theme="dark"] {
    --bg: #08080c;
    --bg-glow-1: rgba(139,92,246,0.10);
    --bg-glow-2: rgba(59,130,246,0.06);
    --bg-layers:
      radial-gradient(circle at 22% 18%, var(--bg-glow-1), transparent 46%),
      radial-gradient(circle at 78% 72%, var(--bg-glow-2), transparent 46%),
      radial-gradient(ellipse 600px 400px at 0% 0%, var(--bg-glow-1) 0%, transparent 60%),
      radial-gradient(ellipse 600px 400px at 100% 100%, var(--bg-glow-2) 0%, transparent 60%);
    --surface: #111118;
    --surface-2: #191922;
    --surface-3: #22222e;
    --surface-hover: #1f1f2b;
    --border: rgba(255,255,255,0.06);
    --border-strong: rgba(255,255,255,0.12);
    --text: #f5f5f8;
    --text-2: #9a9aab;
    --text-3: #5a5a6b;
    --primary: #a78bfa;
    --primary-strong: #8b5cf6;
    --primary-soft: rgba(139,92,246,0.15);
    --green: #34d399;
    --green-soft: rgba(52,211,153,0.14);
    --red: #fb7185;
    --red-soft: rgba(251,113,133,0.14);
    --yellow: #fbbf24;
    --yellow-soft: rgba(251,191,36,0.14);
    --purple: #a78bfa;
    --purple-soft: rgba(167,139,250,0.14);
    --pink: #f472b6;
    --blue: #60a5fa;
    --blue-soft: rgba(96,165,250,0.14);
    --glass: rgba(17,17,24,0.72);
    --glass-border: rgba(255,255,255,0.08);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.35);
    --shadow: 0 4px 16px rgba(0,0,0,0.4);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.5);
    --shadow-xl: 0 24px 60px rgba(0,0,0,0.65);
  }

  [data-theme="light"] {
    --bg: #f6f7f9;
    --bg-glow-1: rgba(139,92,246,0.08);
    --bg-glow-2: rgba(59,130,246,0.05);
    --bg-layers:
      radial-gradient(circle at 22% 18%, var(--bg-glow-1), transparent 46%),
      radial-gradient(circle at 78% 72%, var(--bg-glow-2), transparent 46%),
      radial-gradient(ellipse 600px 400px at 0% 0%, var(--bg-glow-1) 0%, transparent 60%),
      radial-gradient(ellipse 600px 400px at 100% 100%, var(--bg-glow-2) 0%, transparent 60%);
    --surface: #ffffff;
    --surface-2: #f3f4f7;
    --surface-3: #e6e8ee;
    --surface-hover: #f9fafb;
    --border: rgba(0,0,0,0.06);
    --border-strong: rgba(0,0,0,0.12);
    --text: #0d0d15;
    --text-2: #5c5c6e;
    --text-3: #a0a0b0;
    --primary: #7c3aed;
    --primary-strong: #6d28d9;
    --primary-soft: rgba(124,58,237,0.10);
    --green: #059669;
    --green-soft: rgba(5,150,105,0.10);
    --red: #e11d48;
    --red-soft: rgba(225,29,72,0.10);
    --yellow: #d97706;
    --yellow-soft: rgba(217,119,6,0.10);
    --purple: #7c3aed;
    --purple-soft: rgba(124,58,237,0.10);
    --pink: #db2777;
    --blue: #2563eb;
    --blue-soft: rgba(37,99,235,0.10);
    --glass: rgba(255,255,255,0.78);
    --glass-border: rgba(0,0,0,0.05);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow: 0 4px 16px rgba(0,0,0,0.08);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.10);
    --shadow-xl: 0 24px 60px rgba(0,0,0,0.14);
  }

  /* ═══════════ BASE ═══════════ */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding-top: max(env(safe-area-inset-top), 8px);
    font-size: var(--f-md);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background 0.3s, color 0.3s;
    /* живой фон: страница не скроллится (скроллится только .app-main),
       поэтому фон можно вешать как обычный — без background-attachment: fixed,
       который заставляет браузер перерисовывать весь экран */
    background-image: var(--bg-layers);
  }
  ::-webkit-scrollbar { display: none; }
  button { font-family: inherit; }

  /* ═══════════ SPLASH ═══════════ */
  .splash { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; }
  .splash.hidden { display: none; }
  .splash::before, .splash::after {
    content: ''; position: absolute; border-radius: 50%; filter: blur(80px);
    pointer-events: none; animation: floatOrb 10s ease-in-out infinite;
  }
  .splash::before { width: 320px; height: 320px; background: var(--primary-soft); top: -120px; left: -120px; }
  .splash::after { width: 420px; height: 420px; background: var(--bg-glow-2); bottom: -180px; right: -180px; animation-delay: 3s; }
  @keyframes floatOrb { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(24px,-20px) scale(1.08); } }

  .splash-content { text-align: center; max-width: 380px; width: 100%; position: relative; z-index: 1; }
  .splash-logo {
    font-size: 88px; margin-bottom: 16px; display: inline-block;
    filter: drop-shadow(0 20px 40px rgba(139,92,246,0.35));
    animation: splashBounce 0.9s var(--ease-bounce);
  }
  @keyframes splashBounce {
    0% { opacity: 0; transform: scale(0.4) translateY(40px); }
    60% { opacity: 1; transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  .splash h1 {
    font-size: 34px; font-weight: 900; letter-spacing: -0.04em;
    margin: 0 0 10px; line-height: 1.05;
    background: linear-gradient(135deg, var(--primary), var(--purple), var(--pink));
    background-size: 200% 200%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    animation: fadeUp 0.6s 0.15s both;
  }
  .splash-tagline {
    font-size: 15px; color: var(--text-2); font-weight: 500;
    margin-bottom: 36px; line-height: 1.5;
    animation: fadeUp 0.6s 0.3s both;
  }
  .splash-actions { display: flex; flex-direction: column; gap: 10px; }
  .splash-btn-primary {
    padding: 18px; border-radius: 18px; gap: 8px;
    background: linear-gradient(135deg, var(--primary-strong), var(--primary));
    color: #fff; border: none; cursor: pointer;
    font-size: 16px; font-weight: 800; letter-spacing: -0.01em;
    box-shadow: 0 10px 30px var(--primary-soft), 0 2px 6px rgba(0,0,0,0.2);
    transition: transform 0.15s ease;
    animation: fadeUp 0.6s 0.45s both;
  }
  .splash-btn-primary:active { transform: scale(0.97); }
  .splash-btn-secondary {
    padding: 14px; border-radius: 14px; background: transparent; gap: 8px;
    color: var(--text-3); border: none; cursor: pointer;
    font-size: 13px; font-weight: 600;
    animation: fadeUp 0.6s 0.55s both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  /* ═══════════ HUD / HEADER ═══════════ */
  .app-header { flex-shrink: 0; padding: 0; margin: 8px 12px 0; position: relative; z-index: 10; }

  .hud {
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: var(--r-xl);
    padding: 14px 16px 12px;
    box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.04);
    position: relative; overflow: hidden;
  }
  .hud::before {
    content: ''; position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    pointer-events: none;
  }

  .hud-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .hud-brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: var(--f-md); letter-spacing: -0.01em; color: var(--text); }
  .brand-pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 var(--green-soft); animation: brandPulse 2.2s infinite; }
  @keyframes brandPulse { 0%,100% { box-shadow: 0 0 0 0 var(--green-soft); } 50% { box-shadow: 0 0 0 6px transparent; } }
  .hud-meta { display: flex; gap: 6px; }
  .meta-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 10px; border-radius: var(--r-full);
    background: var(--surface-2); border: 1px solid var(--border);
    font-size: var(--f-sm); font-weight: 700; color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }
  .meta-chip.accent { background: var(--primary-soft); color: var(--primary); border-color: transparent; }

  .hud-hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 12px; }
  .money-block { flex: 1; min-width: 0; }
  .money-label { font-size: 9px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 3px; }
  .money-value {
    font-size: 28px; font-weight: 900; letter-spacing: -0.03em;
    line-height: 1.05; color: var(--text);
    font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color 0.3s;
  }
  .money-block.neg .money-value { color: var(--red); }
  .hud-side { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; flex-shrink: 0; }
  .side-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 10px; border-radius: var(--r-full);
    background: var(--surface-2); font-size: var(--f-sm); font-weight: 700;
    color: var(--text-2); white-space: nowrap;
    max-width: 140px; overflow: hidden; text-overflow: ellipsis;
  }
  .side-pill.biz { background: var(--primary-soft); color: var(--primary); }

  .hud-progress { display: flex; flex-direction: column; gap: 8px; }
  .progress-row { display: flex; flex-direction: column; gap: 4px; }
  .progress-info { display: flex; justify-content: space-between; align-items: center; font-size: 9px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; }
  .progress-pct { color: var(--primary); font-weight: 800; }
  .progress-track { height: 7px; border-radius: var(--r-full); background: var(--surface-3); overflow: hidden; position: relative; }
  .progress-fill {
    height: 100%; border-radius: var(--r-full);
    background: linear-gradient(90deg, var(--primary-strong), var(--primary), var(--blue));
    background-size: 200% 100%;
    transition: width 0.8s var(--ease-out);
    box-shadow: 0 0 12px var(--primary-soft);
    position: relative; overflow: hidden;
  }
  /* блик едет через transform — это анимация слоем композитора, без перерисовки */
  .progress-fill::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.38) 50%, transparent 100%);
    transform: translateX(-110%);
    animation: shimmer 3s linear infinite;
  }
  @keyframes shimmer { from { transform: translateX(-110%); } to { transform: translateX(110%); } }

  .progress-row.xp { flex-direction: row; align-items: center; gap: 8px; }
  .progress-row.xp .progress-track { flex: 1; height: 4px; }
  .xp-fill {
    height: 100%; border-radius: var(--r-full);
    background: linear-gradient(90deg, var(--purple), var(--pink));
    background-size: 200% 100%;
    transition: width 0.8s var(--ease-out);
    position: relative; overflow: hidden;
  }
  .xp-fill::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.38) 50%, transparent 100%);
    transform: translateX(-110%);
    animation: shimmer 3s linear infinite;
  }
  .xp-label { font-size: 9px; font-weight: 700; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

  #banners { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  #banners:empty { display: none; }
  .banner { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: var(--r-md); font-size: var(--f-sm); font-weight: 700; animation: slideDown 0.3s var(--ease-out); }
  .banner.event { background: var(--yellow-soft); color: var(--yellow); border: 1px solid rgba(251,191,36,0.25); }
  .banner.debt { background: var(--red-soft); color: var(--red); border: 1px solid rgba(251,113,133,0.25); }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } }

  /* ═══════════ MAIN ═══════════ */
  .app-main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 var(--app-pad) 16px; overscroll-behavior: contain; }
  .app-main.slide-left { animation: slideLeftIn 0.3s var(--ease-out) both; }
  .app-main.slide-right { animation: slideRightIn 0.3s var(--ease-out) both; }
  @keyframes slideLeftIn { from { opacity: 0; transform: translateX(30px); } }
  @keyframes slideRightIn { from { opacity: 0; transform: translateX(-30px); } }
  .panel { display: flex; flex-direction: column; gap: 14px; }

  .section-title {
    font-size: var(--f-sm); font-weight: 800; color: var(--text-3);
    padding: 10px 4px 4px; text-transform: uppercase; letter-spacing: 0.08em;
    display: flex; justify-content: space-between; align-items: center;
  }

  /* ═══════════ SEARCH / SORT / FILTERS ═══════════ */
  .search-box {
    display: flex; gap: 8px; align-items: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-md); padding: 3px 14px; box-shadow: var(--shadow-sm);
    min-height: 44px;
  }
  .search-box .icon { font-size: 15px; color: var(--text-3); display: inline-flex; align-items: center; }
  .search-box .icon .ico { width: 16px; height: 16px; }
  .clear-search .ico { width: 13px; height: 13px; }
  .search-box input {
    flex: 1; border: none; outline: none; background: transparent;
    color: var(--text); font-family: inherit; font-size: var(--f-md); font-weight: 600;
    padding: 0; min-width: 0; height: 38px; line-height: 1.2;
  }
  .search-box input::placeholder { color: var(--text-3); font-weight: 500; }
  .clear-search {
    width: 24px; height: 24px; min-height: auto; padding: 0;
    background: var(--surface-3); border-radius: 50%; font-size: 13px;
    color: var(--text-2); border: none; display: none;
    align-items: center; justify-content: center;
  }
  .clear-search.show { display: flex; }

  .sort-bar, .filters-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .sort-bar::-webkit-scrollbar, .filters-bar::-webkit-scrollbar { display: none; }
  .sort-btn, .filter-btn {
    padding: 8px 14px; border-radius: var(--r-full);
    background: var(--surface); border: 1px solid var(--border);
    font-size: var(--f-base); font-weight: 700; color: var(--text-2);
    white-space: nowrap; transition: all 0.15s;
  }
  .filter-btn { padding: 8px 16px; font-size: var(--f-md); }
  .sort-btn.active, .filter-btn.active {
    background: linear-gradient(135deg, var(--primary-strong), var(--primary));
    color: #fff; border-color: transparent;
    box-shadow: 0 4px 14px var(--primary-soft);
  }
  .result-count { font-size: var(--f-sm); color: var(--text-3); font-weight: 700; padding: 0 4px 8px; }
  .result-count b { color: var(--primary); font-weight: 800; }

  /* ═══════════ CARDS ═══════════ */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-xl); padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: var(--shadow-sm);
    animation: staggerIn .5s var(--ease-out) backwards;
    animation-delay: calc(var(--i, 0) * 45ms);
    position: relative; overflow: hidden;
    transition: border-color .25s ease, box-shadow .3s ease, transform .3s var(--ease-out);
  }
  @media (hover: hover) {
    .card:hover { transform: translateY(-3px) scale(1.006); box-shadow: var(--shadow-lg); border-color: var(--border-strong); }
    .card:active { transform: translateY(-1px) scale(.995); }
    .btn-primary:hover, .btn-buy:hover, .btn-sell:hover, .btn-danger:hover { filter: brightness(1.08); transform: translateY(-1px); }
  }
  .card.hot {
    border-color: var(--red);
    box-shadow: 0 0 0 1px var(--red), 0 8px 28px var(--red-soft);
  }
  .card.onboarding { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  @keyframes staggerIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes pulseBorder { 0%,100% { box-shadow: 0 0 0 3px var(--primary-soft); } 50% { box-shadow: 0 0 0 8px var(--primary-soft); } }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.55; transform: scale(0.92); } }
  .card-top { display: flex; gap: 14px; align-items: flex-start; }
  .emoji-box {
    width: 62px; height: 62px; flex-shrink: 0;
    border-radius: var(--r-md); display: grid; place-items: center;
    overflow: hidden; background: var(--surface-2);
    border: 1px solid var(--border); position: relative;
  }
  .emoji-box.tech    { background: linear-gradient(135deg, rgba(96,165,250,0.20), rgba(139,92,246,0.14)); border-color: rgba(96,165,250,0.15); }
  .emoji-box.home    { background: linear-gradient(135deg, rgba(251,191,36,0.20), rgba(245,158,11,0.14)); border-color: rgba(251,191,36,0.15); }
  .emoji-box.sport   { background: linear-gradient(135deg, rgba(52,211,153,0.20), rgba(16,185,129,0.14)); border-color: rgba(52,211,153,0.15); }
  .emoji-box.hobby   { background: linear-gradient(135deg, rgba(167,139,250,0.20), rgba(139,92,246,0.14)); border-color: rgba(167,139,250,0.15); }
  .emoji-box.fashion { background: linear-gradient(135deg, rgba(251,113,133,0.20), rgba(244,114,182,0.14)); border-color: rgba(251,113,133,0.15); }
  .item-icon { width: 46px; height: 46px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2)); }
  /* запасная эмодзи-иконка: показывается, если картинка не загрузилась */
  .emoji-box::after {
    content: attr(data-fb); position: absolute; inset: 0;
    display: grid; place-items: center; font-size: 32px; line-height: 1;
    opacity: 0; pointer-events: none;
  }
  .emoji-box.no-img::after { opacity: 1; }
  .inline-icon { width: 26px; height: 26px; object-fit: contain; vertical-align: middle; margin-right: 8px; display: inline-block; }
  .fallback-emoji { font-size: 32px; line-height: 1; display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; }
  .inline-fallback-emoji { font-size: 20px; vertical-align: middle; margin-right: 6px; display: inline-block; }

  .info { flex: 1; min-width: 0; }
  .name { font-weight: 800; font-size: var(--f-lg); line-height: 1.3; letter-spacing: -0.01em; }
  .cond { font-size: var(--f-base); color: var(--text-3); margin-top: 4px; font-weight: 600; }

  .tags-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tag {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px; border-radius: var(--r-full);
    font-size: var(--f-xs); font-weight: 700; white-space: nowrap;
    letter-spacing: 0.01em;
  }
  .tag-defect  { background: var(--red-soft); color: var(--red); }
  .tag-demand  { background: var(--yellow-soft); color: var(--yellow); }
  .tag-order   { background: var(--blue-soft); color: var(--blue); }
  .tag-rare    { background: var(--blue-soft); color: var(--blue); }
  .tag-premium { background: var(--yellow-soft); color: var(--yellow); }
  .tag-story   { background: var(--surface-3); color: var(--text-2); }
  .tag-profit  { background: var(--green-soft); color: var(--green); }
  .tag-stock   { background: var(--surface-3); color: var(--text-2); }
  .tag-black   { background: var(--purple-soft); color: var(--purple); }
  .tag-hot     { background: linear-gradient(135deg, var(--red), var(--yellow)); color: #fff; font-weight: 800; }

  .rows {
    display: flex; flex-direction: column; gap: 6px;
    font-size: var(--f-md); background: var(--surface-2);
    padding: 11px 13px; border-radius: var(--r-md);
    border: 1px solid var(--border);
  }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; color: var(--text-2); font-weight: 600; font-size: var(--f-base);
  }
  .row b {
    color: var(--text); font-weight: 800;
    font-variant-numeric: tabular-nums; white-space: nowrap; font-size: var(--f-md);
  }
  .row b.good { color: var(--green); }
  .row b.bad  { color: var(--red); }
  .row b.warn { color: var(--yellow); }

  /* ═══════════ BUTTONS ═══════════ */
  button {
    font-family: inherit; font-weight: 700; font-size: var(--f-md);
    border-radius: var(--r-sm); border: none;
    background: var(--surface-2); color: var(--text);
    padding: 12px 18px; min-height: 44px;
    cursor: pointer; touch-action: manipulation;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform 0.12s, opacity 0.15s, background 0.15s, box-shadow 0.15s;
    letter-spacing: -0.005em;
  }
  button:active:not(:disabled) { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-primary { background: linear-gradient(135deg, var(--primary-strong), var(--primary)); color: #fff; box-shadow: 0 4px 16px var(--primary-soft); }
  .btn-buy     { background: linear-gradient(135deg, var(--green), #059669); color: #fff; box-shadow: 0 4px 16px var(--green-soft); }
  .btn-sell    { background: linear-gradient(135deg, var(--primary-strong), var(--purple)); color: #fff; box-shadow: 0 4px 16px var(--primary-soft); }
  .btn-danger  { background: linear-gradient(135deg, var(--red), #dc2626); color: #fff; box-shadow: 0 4px 16px var(--red-soft); }
  .btn-ghost   { background: transparent; color: var(--text-2); padding: 8px 14px; min-height: 38px; font-size: var(--f-base); border: 1px solid var(--border); }
  .btn-full    { width: 100%; padding: 15px; font-size: var(--f-lg); border-radius: var(--r-md); }
  .btn-sm      { padding: 8px 14px; min-height: 36px; font-size: var(--f-sm); border-radius: var(--r-sm); }

  .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  .actions button { min-width: 0; width: 100%; font-size: var(--f-sm); padding: 10px 8px; }
  .actions button.wide { grid-column: 1 / -1; font-size: var(--f-base); }
  .actions:has(> button:only-child) { grid-template-columns: 1fr; }
  .actions > button:only-child { grid-column: 1 / -1; }

  .empty { text-align: center; padding: 48px 20px; color: var(--text-3); font-size: var(--f-md); line-height: 1.6; font-weight: 600; }

  /* ═══════════ BOTTOM NAV ═══════════ */
  .bottom-nav {
    flex-shrink: 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px;
    margin: 8px 12px calc(12px + env(safe-area-inset-bottom));
    padding: 6px; border-radius: var(--r-xl);
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow-lg);
  }
  .nav-btn {
    background: none; border: none; padding: 9px 4px 7px; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: var(--text-3); font-family: inherit; cursor: pointer;
    position: relative; transition: color 0.2s, background 0.2s;
  }
  .nav-btn.active { background: var(--primary-soft); color: var(--primary); }
  .nav-ico { font-size: 20px; transition: transform 0.3s var(--ease-bounce); }
  .nav-btn.active .nav-ico { transform: scale(1.15) translateY(-1px); }
  .nav-label { font-size: 9px; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; }
  .nav-btn .dot {
    position: absolute; top: 4px; right: 22%;
    width: 7px; height: 7px; border-radius: 50%; background: var(--red);
    display: none; box-shadow: 0 0 0 2px var(--surface);
  }
  .nav-btn .dot.on { display: block; animation: pulse 2s infinite; }

  /* ═══════════ MODAL / SHEET ═══════════ */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 50; backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    animation: fadeIn 0.2s ease;
  }
  .modal.hidden { display: none; }
  @keyframes fadeIn { from { opacity: 0; } }
  .sheet {
    width: 100%; max-width: 500px;
    background: var(--surface);
    border-top-left-radius: var(--r-3xl); border-top-right-radius: var(--r-3xl);
    padding: 10px 20px calc(20px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 16px;
    max-height: 92dvh; overflow-y: auto;
    animation: slideUpBounce 0.4s var(--ease-bounce);
    box-shadow: 0 -8px 40px rgba(0,0,0,0.3);
    border-top: 1px solid var(--glass-border);
  }
  @keyframes slideUpBounce { 0% { transform: translateY(100%); } 60% { transform: translateY(-3%); } 100% { transform: translateY(0); } }
  .drag-handle { width: 44px; height: 5px; background: var(--text-3); opacity: 0.4; border-radius: 3px; margin: 0 auto 10px; }
  .sheet h2 { margin: 0; font-size: var(--f-2xl); font-weight: 900; display: flex; align-items: center; gap: 8px; letter-spacing: -0.02em; }
  .hint {
    font-size: var(--f-md); color: var(--text-2); line-height: 1.6;
    padding: 14px 16px; background: var(--surface-2);
    border-radius: var(--r-md); border-left: 3px solid var(--primary); font-weight: 600;
  }

  /* ═══════════ CHAT ═══════════ */
  .chat-header { display: flex; align-items: center; gap: 14px; padding: 4px 0 14px; border-bottom: 1px solid var(--border); }
  .chat-header > div:last-child { flex: none; }
  .chat-avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 26px; border: 2px solid var(--border); }
  .chat-name { font-weight: 900; font-size: var(--f-xl); letter-spacing: -0.01em; }
  .chat-status { font-size: var(--f-sm); color: var(--green); display: flex; align-items: center; gap: 6px; font-weight: 700; margin-top: 2px; }
  .chat-status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .chat-status.offline { color: var(--text-3); }
  .chat-messages { display: flex; flex-direction: column; gap: 10px; padding: 8px 0; max-height: 40dvh; overflow-y: auto; }
  .chat-messages.compact { max-height: 15dvh; }
  .msg { display: flex; gap: 8px; align-items: flex-end; animation: msgIn 0.35s var(--ease-out); }
  @keyframes msgIn { from { opacity: 0; transform: translateY(12px) scale(0.94); } }
  .msg.me { flex-direction: row-reverse; }
  .msg-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 16px; flex-shrink: 0; }
  .msg-bubble {
    max-width: 80%; padding: 10px 14px; border-radius: 18px;
    font-size: var(--f-md); line-height: 1.45; background: var(--surface-2);
    border-bottom-left-radius: 5px; word-wrap: break-word; font-weight: 600;
  }
  .msg.me .msg-bubble {
    background: linear-gradient(135deg, var(--primary-strong), var(--primary));
    color: #fff; border-bottom-left-radius: 18px; border-bottom-right-radius: 5px;
  }
  .chat-actions { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; border-top: 1px solid var(--border); }
  .quick-offers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .quick-offers button {
    padding: 11px 4px; font-size: var(--f-md); background: var(--surface-2);
    font-weight: 800; border-radius: var(--r-sm); color: var(--text-2);
    border: 1px solid var(--border);
  }

  /* ═══════════ KEYBOARD ═══════════ */
  .custom-keyboard { display: flex; flex-direction: column; gap: 10px; }
  .keyboard-display { background: var(--surface-2); border-radius: var(--r-lg); padding: 14px; text-align: center; border: 1px solid var(--border); }
  .keyboard-label { font-size: var(--f-sm); color: var(--text-3); font-weight: 700; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  .keyboard-value { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .keyboard-value.empty { color: var(--text-3); font-size: 24px; }
  .keyboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .key-btn { padding: 15px 4px; font-size: 20px; font-weight: 800; border-radius: var(--r-sm); background: var(--surface-2); min-height: 54px; border: 1px solid var(--border); }
  .key-action { color: var(--text-2); background: transparent; }
  .keyboard-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .keyboard-submit { background: linear-gradient(135deg, var(--primary-strong), var(--primary)); color: #fff; }

  /* ═══════════ TOAST ═══════════ */
  .toast {
    position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: var(--text); color: var(--bg);
    padding: 12px 22px; border-radius: var(--r-full);
    font-size: var(--f-md); font-weight: 800; z-index: 99;
    max-width: 85vw; text-align: center;
    box-shadow: var(--shadow-xl);
    animation: toastUp 0.4s var(--ease-bounce);
    pointer-events: none;
  }
  .toast.success { background: linear-gradient(135deg, var(--green), #059669); color: #fff; }
  .toast.error   { background: linear-gradient(135deg, var(--red), #dc2626); color: #fff; }
  .toast.reward  { background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; }
  @keyframes toastUp { from { opacity: 0; transform: translate(-50%, 30px) scale(0.8); } }

  .confetti { position: fixed; pointer-events: none; font-size: 22px; z-index: 999; animation: confettiFall 2s ease-out forwards; }
  @keyframes confettiFall { 0% { opacity: 1; transform: translate(0,0) rotate(0); } 100% { opacity: 0; transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); } }
  .coin-fly { position: fixed; pointer-events: none; font-size: 26px; z-index: 998; animation: coinFly 1.2s forwards; }
  @keyframes coinFly { 0% { opacity: 1; transform: scale(1) translateY(0); } 100% { opacity: 0; transform: scale(0.3) translateY(-200px); } }

  /* ═══════════ STATS / PROFILE ═══════════ */
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stat-mini { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px; display: flex; flex-direction: column; gap: 4px; }
  .stat-mini .l { font-size: var(--f-sm); color: var(--text-3); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .stat-mini .v { font-size: var(--f-xl); font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

  .rank-card {
    background: linear-gradient(135deg, var(--purple), var(--primary-strong), var(--pink));
    background-size: 200% 200%; color: #fff;
    border-radius: var(--r-2xl); padding: 30px 20px; text-align: center;
    position: relative; overflow: hidden;
    animation: gradientMove 8s ease infinite;
    box-shadow: 0 12px 40px var(--purple-soft);
  }
  @keyframes gradientMove { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .rank-emoji { font-size: 56px; margin-bottom: 6px; display: inline-block; filter: drop-shadow(0 8px 20px rgba(0,0,0,0.25)); }
  .rank-name { font-size: 26px; font-weight: 900; margin-bottom: 4px; letter-spacing: -0.02em; text-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .rank-desc { font-size: var(--f-base); opacity: 0.92; font-weight: 600; }
  .level-bar { display: flex; gap: 5px; margin-top: 16px; }
  .level-seg { flex: 1; height: 5px; background: rgba(255,255,255,0.25); border-radius: var(--r-full); }
  .level-seg.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.4); }
  .prestige-badge {
    position: absolute; top: 14px; right: 14px;
    background: rgba(0,0,0,0.28); backdrop-filter: blur(8px);
    padding: 5px 11px; border-radius: var(--r-full);
    font-size: var(--f-sm); font-weight: 800;
    border: 1px solid rgba(255,255,255,0.2);
  }

  .ach-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .ach {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-md); padding: 12px;
    display: flex; flex-direction: column; gap: 3px;
    align-items: center; text-align: center; opacity: 0.35;
    transition: opacity 0.2s, border-color 0.2s, background 0.2s;
  }
  .ach.unlocked { opacity: 1; border-color: var(--yellow); background: var(--yellow-soft); }
  .ach-emoji { font-size: 28px; margin-bottom: 2px; }
  .ach-name { font-size: var(--f-sm); font-weight: 800; line-height: 1.2; }
  .ach-desc { font-size: var(--f-xs); color: var(--text-3); line-height: 1.3; font-weight: 600; }

  /* ═══════════ SKILLS ═══════════ */
  .skill-branch { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .skill-head { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: var(--f-lg); }
  .skill-nodes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .skill-node {
    border-radius: var(--r-sm); padding: 12px 8px; font-size: var(--f-xs);
    text-align: center; background: var(--surface-2); color: var(--text-3);
    font-weight: 700; display: flex; flex-direction: column; gap: 3px;
    align-items: center; min-height: 76px; justify-content: center;
    border: 2px solid transparent; transition: all 0.2s;
  }
  .skill-node.active { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .skill-node.next { border-style: dashed; border-color: var(--primary); color: var(--primary); cursor: pointer; }
  .skill-node .lvl { font-size: var(--f-xl); }
  .skill-node .lbl { font-size: var(--f-xs); }

  /* ═══════════ MINI-GAME (REPAIR) ═══════════ */
  .mg-title { text-align: center; font-size: var(--f-xl); font-weight: 900; letter-spacing: -0.01em; }
  .mg-round { text-align: center; font-size: var(--f-base); color: var(--text-2); margin-bottom: 10px; font-weight: 700; }
  .mg-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
  .mg-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--surface-3); }
  .mg-dot.hit { background: var(--yellow); } .mg-dot.perfect { background: var(--green); }
  .mg-dot.miss { background: var(--red); } .mg-dot.current { background: var(--primary); }
  .mg-bar { position: relative; height: 76px; background: var(--surface-2); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 14px; border: 1px solid var(--border); }
  .mg-zone-good { position: absolute; top: 0; bottom: 0; background: var(--yellow-soft); }
  .mg-zone-perfect { position: absolute; top: 0; bottom: 0; background: var(--green-soft); }
  .mg-cursor { position: absolute; top: 0; bottom: 0; width: 8px; margin-left: -4px; background: var(--primary); border-radius: 4px; box-shadow: 0 0 20px var(--primary); z-index: 2; will-change: left; }
  .mg-result { text-align: center; font-size: var(--f-lg); font-weight: 900; padding: 13px; border-radius: var(--r-md); min-height: 50px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .mg-result.perfect { background: var(--green-soft); color: var(--green); }
  .mg-result.good { background: var(--yellow-soft); color: var(--yellow); }
  .mg-result.miss { background: var(--red-soft); color: var(--red); }
  .mg-result.empty { background: var(--surface-2); color: var(--text-3); }
  .mg-summary { text-align: center; }
  .mg-summary .big { font-size: 72px; margin-bottom: 10px; display: inline-block; }
  .mg-summary .txt { font-size: var(--f-xl); font-weight: 900; margin-bottom: 6px; letter-spacing: -0.01em; }
  .mg-summary .sub { font-size: var(--f-base); color: var(--text-2); margin-bottom: 18px; font-weight: 600; }

  /* ═══════════ SWITCHERS ═══════════ */
  .theme-switcher, .lang-switcher { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; background: var(--surface-2); border-radius: var(--r-md); }
  .lang-switcher { grid-template-columns: repeat(3, 1fr); }
  .theme-btn, .lang-btn { padding: 11px; border-radius: var(--r-sm); background: transparent; color: var(--text-2); font-size: var(--f-md); font-weight: 700; min-height: 42px; }
  .theme-btn.active, .lang-btn.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); font-weight: 800; }

  /* ═══════════ MISC ═══════════ */
  .bonus-toast {
    position: fixed; top: 28%; left: 50%; transform: translate(-50%, -50%);
    background: var(--surface); border-radius: var(--r-3xl);
    padding: 32px 42px; text-align: center;
    font-size: var(--f-lg); font-weight: 700; z-index: 200;
    box-shadow: var(--shadow-xl); animation: bonusPop 0.6s var(--ease-bounce);
    min-width: 280px; border: 2px solid var(--green);
  }
  .bonus-toast .amt { font-size: 38px; color: var(--green); margin: 12px 0; font-weight: 900; letter-spacing: -0.02em; }
  @keyframes bonusPop { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.5); } 60% { transform: translate(-50%,-50%) scale(1.08); } 100% { transform: translate(-50%,-50%) scale(1); } }

  .tutorial-card { background: var(--surface); border: 2px solid var(--primary); border-radius: var(--r-xl); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .tutorial-title { font-size: var(--f-lg); font-weight: 900; display: flex; align-items: center; gap: 8px; color: var(--primary); letter-spacing: -0.01em; }
  .tutorial-steps { font-size: var(--f-md); line-height: 1.7; color: var(--text-2); font-weight: 600; }
  .tutorial-steps span { color: var(--primary); font-weight: 900; margin-right: 6px; }

  .onboarding-tip {
    background: var(--primary-soft); color: var(--primary);
    padding: 13px 15px; border-radius: var(--r-md);
    font-size: var(--f-md); font-weight: 700; line-height: 1.5;
    display: flex; align-items: center; gap: 10px;
    border: 2px solid var(--primary);
  }
  .onboarding-tip .arrow { font-size: 20px; }

  .season-indicator {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--r-full);
    font-size: var(--f-base); color: var(--text-2); font-weight: 600;
    align-self: flex-start;
  }
  .season-indicator b { color: var(--text); font-weight: 800; }

  .auction-card {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #fff; border-radius: var(--r-xl); padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 8px 24px rgba(245,158,11,0.3);
  }
  .auction-btn { background: #fff; color: #d97706; font-weight: 900; border: none; padding: 13px; border-radius: var(--r-md); text-transform: uppercase; font-size: var(--f-md); letter-spacing: 0.02em; }

  .quest-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; background: var(--surface-2);
    border-radius: var(--r-md); margin-bottom: 6px;
    border-left: 3px solid var(--primary);
  }
  .quest-item.done { border-left-color: var(--green); opacity: 0.55; }
  .quest-text { font-size: var(--f-base); font-weight: 700; }
  .quest-reward { font-size: var(--f-sm); color: var(--green); font-weight: 800; }

  .sync-box {
    width: 100%; height: 80px; padding: 12px;
    border-radius: var(--r-md); border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text);
    font-family: ui-monospace, monospace; font-size: 10px; resize: none;
  }

  .privacy-content { font-size: var(--f-md); line-height: 1.7; color: var(--text-2); max-height: 60dvh; overflow-y: auto; font-weight: 500; }
  .privacy-content h3 { font-size: var(--f-lg); font-weight: 900; color: var(--text); margin: 22px 0 8px; letter-spacing: -0.01em; }
  .privacy-content p { margin: 8px 0; }
  .privacy-content b { color: var(--text); font-weight: 800; }

  /* ═══════════ НОВЫЕ БЛОКИ: ТРЕНДЫ, ЦЕЛИ, СЮЖЕТЫ, ЧЁРНЫЙ РЫНОК ═══════════ */
  .spark { display: block; width: 84px; height: 26px; margin: 8px 0 0 auto; opacity: .9; overflow: visible; }
  .spark path { vector-effect: non-scaling-stroke; }
  .trend-up { color: var(--green) !important; }
  .trend-down { color: var(--red) !important; }
  .goal-card { background: linear-gradient(135deg, var(--primary-soft), transparent); border: 2px solid var(--primary); border-radius: var(--r-xl); padding: 14px; }
  .goal-card .t { font-size: var(--f-md); font-weight: 800; margin-bottom: 4px; }
  .goal-bar { height: 8px; border-radius: var(--r-full); background: var(--surface-3); overflow: hidden; margin-top: 8px; }
  .goal-bar > div { height: 100%; background: linear-gradient(90deg, var(--primary-strong), var(--pink)); border-radius: var(--r-full); transition: width 0.6s var(--ease-out); }
  .story-card { background: var(--surface); border: 2px solid var(--yellow); border-radius: var(--r-xl); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .story-card .t { font-size: var(--f-lg); font-weight: 900; }
  .story-card .d { font-size: var(--f-base); color: var(--text-2); font-weight: 600; line-height: 1.5; }
  .story-choice { width: 100%; justify-content: flex-start; text-align: left; }
  .black-card { border-color: var(--purple); box-shadow: 0 0 0 1px var(--purple), 0 8px 28px var(--purple-soft); }
  .lock-note { font-size: var(--f-sm); color: var(--text-3); font-weight: 700; text-align: center; padding: 18px; }
  .rep-tier { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-full); background: var(--green-soft); color: var(--green); font-weight: 800; font-size: var(--f-sm); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, .nav-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* ═══════════ ПРОСТРАНСТВО МЕЖДУ КАРТОЧКАМИ ═══════════ */
  :root { --gap-card: 14px; --gap-list: 12px; --gap-wide: 20px; --app-pad: 12px; }
  [data-device="desktop"] { --app-pad: 18px; }
  .stack { display: flex; flex-direction: column; gap: var(--gap-list); }
  .stack-lg { display: flex; flex-direction: column; gap: var(--gap-card); }
  #marketResults, #invResults, #orderResults, #storageResults { display: flex; flex-direction: column; gap: var(--gap-card); }
  /* отступ сверху для панелей (у рынка его даёт тулбар над списком) */
  .panel > *:first-child { margin-top: 12px; }
  /* ровные карточки: содержимое прижато к низу, кнопки на одной линии */
  #marketResults .card, #invResults .card { display: flex; flex-direction: column; height: 100%; }
  #marketResults .card .info, #invResults .card .info { flex: 1; }
  #marketResults .card .rows, #invResults .card .rows { margin-top: auto; }
  #marketResults .card .name, #invResults .card .name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-list { display: flex; flex-direction: column; gap: var(--gap-card); }

  /* ═══════════ БРЕНД-БЕЙДЖ ═══════════ */

  /* ═══════════ РЕЖИМ УСТРОЙСТВА: ТЕЛЕФОН / КОМПЬЮТЕР ═══════════ */
  [data-device="desktop"] body { max-width: 1180px; margin: 0 auto; }
  [data-device="desktop"] .hud { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; align-items: center; padding: 16px 20px 14px; }
  [data-device="desktop"] .hud-top { grid-column: 1 / -1; margin-bottom: 10px; }
  [data-device="desktop"] .hud-hero { grid-column: 1 / -1; margin-bottom: 4px; }
  [data-device="desktop"] .hud-progress { grid-column: 1 / -1; margin-top: 10px; }
  [data-device="desktop"] .money-value { font-size: 34px; }
  [data-device="desktop"] .app-main { padding: 0 18px 26px; }
  [data-device="desktop"] #marketResults, [data-device="desktop"] #invResults { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: var(--gap-card); align-items: stretch; }
  [data-device="desktop"] .sort-bar, [data-device="desktop"] .filters-bar { flex-wrap: wrap; overflow: visible; }
  [data-device="desktop"] .nav-label { font-size: 11px; }
  [data-device="desktop"] .nav-btn { padding: 11px 4px 9px; }
  [data-device="desktop"] .sheet { max-width: 760px; }
  [data-device="desktop"] .bottom-nav { padding: 8px 10px; }
  [data-device="desktop"] .profile-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }

  [data-device="phone"] .nav-label { font-size: 9.5px; }
  [data-device="phone"] button { min-height: 46px; }
  [data-device="phone"] .card { padding: 14px; gap: 12px; }
  [data-device="phone"] .row { font-size: var(--f-base); }
  /* на телефоне размытие шапки/навигации дешевле */
  [data-device="phone"] .hud, [data-device="phone"] .bottom-nav {
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
  }

  /* ═══════════ РАЗДЕЛЫ ПРОФИЛЯ ═══════════ */
  .profile-section { display: flex; flex-direction: column; gap: 10px; }
  .rec-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 13px; background: var(--surface-2); border-radius: var(--r-sm); font-size: var(--f-base); font-weight: 600; color: var(--text-2); }
  .rec-row b { color: var(--text); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rec-row b.good { color: var(--green); }
  .rec-row b.bad { color: var(--red); }
  .help-list { font-size: var(--f-base); color: var(--text-2); line-height: 1.75; font-weight: 600; }
  .help-list b { color: var(--text); font-weight: 800; }
  .help-list li { margin-bottom: 4px; }
  .device-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; background: var(--surface-2); border-radius: var(--r-md); }
  .device-btn { padding: 12px 8px; border-radius: var(--r-sm); background: transparent; color: var(--text-2); font-size: var(--f-md); font-weight: 700; min-height: 48px; flex-direction: column; gap: 2px; }
  .device-btn.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); font-weight: 800; }
  .device-btn .dev-ico { font-size: 20px; display: inline-grid; place-items: center; }
  .device-btn .dev-ico .ico { width: 20px; height: 20px; }
  .save-info { font-size: var(--f-sm); color: var(--text-3); font-weight: 700; text-align: center; padding: 4px; }

  /* ═══════════ ПЛАВНОСТЬ: ИНДИКАТОР, RIPPLE, ЛЕТЯЩАЯ КАРТОЧКА ═══════════ */
  .bottom-nav { position: relative; }
  .nav-pill {
    position: absolute; top: 6px; bottom: 6px; left: 0; width: 0; border-radius: 16px;
    background: var(--primary-soft); opacity: 0; z-index: 0; pointer-events: none;
    transition: transform .38s var(--ease-out), width .38s var(--ease-out), opacity .3s ease;
  }
  .nav-pill.on { opacity: 1; }
  .nav-btn { position: relative; z-index: 1; }
  .nav-btn.active { background: none; }

  button { position: relative; overflow: hidden; }
  .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.35); transform: scale(0); pointer-events: none; animation: rippleOut .6s ease-out; }
  @keyframes rippleOut { to { transform: scale(2.6); opacity: 0; } }

  .fly-card { position: fixed; z-index: 300; pointer-events: none; border-radius: 16px; overflow: hidden;
    box-shadow: 0 18px 44px rgba(0,0,0,.45); transform-origin: center;
    transition: transform .58s var(--ease-out), opacity .58s ease-in; }
  @media (hover: hover) { .ripple { background: rgba(255,255,255,.28); } }

  @keyframes moneyPulse { 0% { transform: scale(1); } 35% { transform: scale(1.09); } 100% { transform: scale(1); } }
  .money-value.money-pulse { animation: moneyPulse .5s var(--ease-bounce); }
  @keyframes glowPulse { 0%,100% { box-shadow: 0 0 0 0 var(--primary-soft); } 50% { box-shadow: 0 0 0 7px transparent; } }
  .card.just-bought { animation: glowPulse .9s ease-out; }
  @keyframes navPing { 0% { transform: scale(1); opacity: 1; } 75%,100% { transform: scale(2.4); opacity: 0; } }
  .nav-btn .dot.on { animation: navPing 1.9s cubic-bezier(0,0,.2,1) infinite; }
  @keyframes iconPop { 0% { transform: scale(1); } 45% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .emoji-box.pop { animation: iconPop .45s var(--ease-bounce); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }


  /* ═══════════ ВЕКТОРНЫЕ ИКОНКИ ═══════════ */
  .ico { width: 1.05em; height: 1.05em; flex: none; vertical-align: -0.14em; }
  .nav-ico { display: inline-grid; place-items: center; width: 24px; height: 24px; }
  .nav-ico .ico { width: 21px; height: 21px; }
  .chip-ico { display: inline-flex; align-items: center; justify-content: center; }
  .chip-ico .ico { width: 1.15em; height: 1.15em; }
  .tag .ico { width: 12px; height: 12px; flex: none; }
  .btn-ico { display: inline-flex; align-items: center; justify-content: center; }
  .btn-ico .ico { width: 1.1em; height: 1.1em; }
  .ach-ico { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 11px; background: var(--surface-2); color: var(--text-3); margin-bottom: 4px; }
  .ach.unlocked .ach-ico { background: var(--yellow-soft); color: var(--yellow); box-shadow: 0 4px 14px -6px var(--yellow); }
  .ach-ico .ico { width: 18px; height: 18px; }
  .season-ico .ico { width: 18px; height: 18px; }
  .goal-ico .ico { width: 17px; height: 17px; }
  .story-ico .ico { width: 20px; height: 20px; }
  .biz-ico .ico { width: 18px; height: 18px; }
  .level-ico .ico { width: 17px; height: 17px; }
  .empty-art { display: grid; place-items: center; width: 62px; height: 62px; margin: 0 auto 10px; border-radius: 20px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-3); animation: floatY 3.4s ease-in-out infinite; }
  .empty-art .ico { width: 30px; height: 30px; }


  /* ═══════════ ПОЯВЛЕНИЕ ПРИ ПРОКРУТКЕ ═══════════ */
  /* только сдвиг: масштаб заставляет браузер перерисовывать карточку заново,
     а сдвиг композитится на видеокарте без перерисовки */
  .card.reveal { animation: none !important; opacity: 1; transform: translateY(16px); transition: transform .5s var(--ease-out); }
  .card.far .spark { display: none; }
  .card.reveal.revealed { transform: none; }
  /* «none !important» выше глушит анимации карточки — возвращаем подсветку */
  .card.hot.reveal::after { animation: none; }
  .card.urgent.reveal { animation: none !important; }
  [data-motion="off"] .card.reveal { transform: none !important; }

  /* ═══════════ ДОП. АНИМАЦИИ ═══════════ */
  .brand-name { position: relative; background: linear-gradient(90deg, var(--text) 40%, var(--primary) 50%, var(--text) 60%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: brandSheen 6s ease-in-out infinite; }
  @keyframes brandSheen { 0%, 100% { background-position: 120% 0; } 55% { background-position: -20% 0; } }
  /* срочный заказ — статичная подсветка, без бесконечной перерисовки тени */
  .card.urgent { border-color: var(--red); box-shadow: 0 0 0 1px rgba(251,113,133,.45), 0 8px 24px rgba(251,113,133,.14); }
  .season-indicator { transition: transform .25s var(--ease-out), box-shadow .3s; }
  @media (hover: hover) { .season-indicator:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); } }
  .quest-item { transition: transform .2s var(--ease-out), background .22s, border-color .22s; }
  @media (hover: hover) { .quest-item:hover { transform: translateX(3px); } }
  .meta-chip, .side-pill { transition: transform .2s var(--ease-out), background .2s; }
  @media (hover: hover) { .meta-chip:hover, .side-pill:hover { transform: translateY(-2px); } }
  .ach-ico { transition: transform .3s var(--ease-spring), background .25s, color .25s; }
  @media (hover: hover) { .ach:hover .ach-ico { transform: scale(1.12) rotate(-6deg); } }
  .btn-buy, .btn-sell, .btn-primary { position: relative; overflow: hidden; }
  .banner { transition: transform .2s var(--ease-out); }
  @media (hover: hover) { .banner:hover { transform: scale(1.01); } }
  .rank-card { transition: transform .3s var(--ease-out); }
  @media (hover: hover) { .rank-card:hover { transform: translateY(-2px); } }
  .goal-bar > div { transition: width .8s var(--ease-out); }
  .hud-top { transition: transform .25s var(--ease-out); }


  /* ═══════════ ЦВЕТ ИНТЕРФЕЙСА ═══════════ */
  .accent-grid { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .accent-dot { width: 42px; height: 42px; border-radius: 15px; padding: 0; border: 2px solid transparent; background: var(--surface-2); display: grid; place-items: center; min-height: 0; }
  .accent-dot span { width: 22px; height: 22px; border-radius: 8px; background: var(--c); box-shadow: 0 3px 10px -3px var(--c); transition: transform .28s var(--ease-spring), box-shadow .25s; }
  .accent-dot.active { border-color: var(--c); background: var(--surface-3); }
  .accent-dot.active span { transform: scale(1.18); box-shadow: 0 4px 14px -3px var(--c); }
  @media (hover: hover) { .accent-dot:hover span { transform: scale(1.14); } }

  /* ═══════════ ПОЛОСА ПРОКРУТКИ ═══════════ */
  .scroll-progress { height: 3px; margin: 0 12px; position: relative; z-index: 9; }
  .scroll-progress > div { height: 100%; width: 0; border-radius: 0 4px 4px 0; background: linear-gradient(90deg, var(--primary), var(--primary-strong), var(--pink)); transition: width .12s linear; box-shadow: 0 0 12px -2px var(--primary); }

  /* ═══════════ ЛИПКАЯ ПАНЕЛЬ ФИЛЬТРОВ ═══════════ */
  .sticky-bar { position: sticky; top: -6px; z-index: 6; padding: 8px 0 10px; margin: -8px 0 2px; background: linear-gradient(180deg, var(--bg) 62%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: var(--r-md); animation: fadeUp .4s var(--ease-out) backwards; }
  .app-main { scroll-behavior: smooth; }


  /* ═══════════ ТУЛБАР РЫНКА (переделан с нуля) ═══════════ */
  /* тулбар стоит на своём месте перед товарами и уезжает вместе с ними
     при прокрутке — липнет к верху он больше не должен. */
  .toolbar {
    position: static;
    margin: 0 0 12px;
    padding: 0;
    background: none;
    animation: fadeUp .42s var(--ease-out) backwards;
  }
  .tb-search {
    display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 12px;
    background: var(--surface-2); border: none; border-radius: 13px;
    transition: box-shadow .25s, background .25s;
  }
  .tb-search:focus-within { background: var(--surface-3); box-shadow: 0 0 0 2px var(--primary-soft); }
  .tb-search .icon { display: inline-flex; color: var(--text-3); }
  .tb-search .icon .ico { width: 15px; height: 15px; }
  .tb-search input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-family: inherit; font-size: var(--f-base); font-weight: 600; min-width: 0; height: 100%; }
  .tb-search input::placeholder { color: var(--text-3); font-weight: 500; }
  .tb-search .clear-search { width: 22px; height: 22px; min-height: 0; padding: 0; border-radius: 50%; background: var(--surface-3); color: var(--text-2); display: none; align-items: center; justify-content: center; }
  .tb-search .clear-search.show { display: flex; }
  .tb-search .clear-search .ico { width: 11px; height: 11px; }
  .tb-seg {
    position: relative; display: flex; gap: 2px; margin-top: 8px; padding: 4px;
    background: var(--surface-2); border: none; border-radius: 14px;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .tb-seg::-webkit-scrollbar { display: none; }
  .tb-seg > button {
    position: relative; z-index: 1; flex: none; display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px; min-height: 32px; border-radius: 10px; background: transparent; color: var(--text-2);
    font-size: var(--f-sm); font-weight: 700; white-space: nowrap; transition: color .22s;
  }
  .tb-seg > button .ico { width: 14px; height: 14px; opacity: .85; }
  .tb-seg > button.active { color: #fff; }
  .tb-seg > button.active .ico { opacity: 1; }
  .tb-seg .seg-ind {
    position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; z-index: 0; border-radius: 10px;
    background: linear-gradient(135deg, var(--primary-strong), var(--primary));
    box-shadow: 0 5px 16px -7px var(--primary);
    transition: transform .34s var(--ease-out), width .34s var(--ease-out);
  }
  .tb-row { display: flex; align-items: center; gap: 9px; margin-top: 8px; }
  .tb-row .tb-label { font-size: 9px; font-weight: 800; color: var(--text-3); text-transform: uppercase; letter-spacing: .09em; flex: none; }
  .tb-row .tb-seg { margin-top: 0; flex: 1; min-width: 0; }
  @media (hover: hover) { .tb-seg > button:hover { color: var(--text); } .tb-seg > button.active:hover { color: #fff; } }


  /* ═══════════ ШАПКИ ПАНЕЛЕЙ ═══════════ */
  .panel-head {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: linear-gradient(150deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
    animation: fadeUp .45s var(--ease-out) backwards;
  }
  .panel-head .ph-ico { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: var(--primary-soft); color: var(--primary); flex: none; }
  .panel-head .ph-ico .ico { width: 21px; height: 21px; }
  .panel-head .ph-txt { min-width: 0; }
  .panel-head .ph-title { font-size: var(--f-lg); font-weight: 900; letter-spacing: -0.02em; line-height: 1.15; }
  .panel-head .ph-sub { font-size: var(--f-sm); color: var(--text-3); font-weight: 700; margin-top: 2px; }
  .panel-head .ph-right { margin-left: auto; text-align: right; flex: none; }
  .panel-head .ph-right b { font-size: var(--f-md); }

  /* ═══════════ HUD: ЦЕЛЬ И БЫСТРОЕ ДЕЙСТВИЕ ═══════════ */
  .goal-chip { background: var(--primary-soft); color: var(--primary); border-color: transparent; }

  /* ═══════════ ПОДТВЕРЖДЕНИЕ ДВОЙНЫМ КАСАНИЕМ ═══════════ */
  .armed-lbl { display: none; font-weight: 900; color: var(--yellow); }
  .btn-ghost.armed { border-color: var(--yellow) !important; color: var(--yellow) !important; animation: armedPulse 1s ease-in-out infinite; }
  .btn-ghost.armed .armed-lbl { display: inline; }
  @keyframes armedPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(251,191,36,.35); } 50% { box-shadow: 0 0 0 6px rgba(251,191,36,0); } }

  /* ═══════════ ЖУРНАЛ ДЕЙСТВИЙ ═══════════ */
  .log-ico { display: inline-flex; margin-right: 8px; vertical-align: -3px; color: var(--primary); }
  .log-ico .ico { width: 14px; height: 14px; }


  .toast { display: flex; align-items: center; gap: 12px; }
  .toast-btn {
    background: rgba(255,255,255,.22); color: inherit; font-size: var(--f-sm); font-weight: 800;
    padding: 5px 10px; min-height: 26px; border-radius: var(--r-full); white-space: nowrap;
  }
  .toast-btn:hover { background: rgba(255,255,255,.34); }

  /* ═══════════ СОВРЕМЕННЫЙ UI v2 ═══════════ */
  .hud { padding: 16px 18px 14px; box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.07), 0 0 40px -18px var(--primary); }
  .hud::before { background: linear-gradient(90deg, transparent, var(--primary), transparent); opacity: .5; height: 1px; }
  .money-value {
    background: linear-gradient(120deg, var(--text) 30%, var(--primary) 55%, var(--text) 80%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: moneySheen 9s ease-in-out infinite;
    letter-spacing: -0.035em;
  }
  .money-block.neg .money-value { background: linear-gradient(120deg, var(--red) 40%, var(--red) 60%); -webkit-background-clip: text; background-clip: text; }
  @keyframes moneySheen { 0%, 100% { background-position: 130% 0; } 55% { background-position: -30% 0; } }
  .money-label { opacity: .85; }
  .progress-track { height: 9px; box-shadow: inset 0 1px 2px rgba(0,0,0,.35); }
  .progress-row.xp .progress-track { height: 6px; }
  .meta-chip { background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
  .meta-chip.accent { background: var(--primary-soft); }
  .bottom-nav::before { content: ''; position: absolute; left: 10%; right: 10%; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--primary), transparent); opacity: .45; }
  .btn-full { background-image: linear-gradient(120deg, var(--primary-strong), var(--primary) 45%, var(--pink)); background-size: 200% 100%; box-shadow: 0 10px 28px -12px var(--primary); }
  @media (hover: hover) { .btn-full:hover { background-position: 100% 0; filter: brightness(1.06); } }
  .hud-hero { align-items: center; }
  .side-pill { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .side-pill.biz { background: var(--primary-soft); }
  .progress-info { letter-spacing: .08em; }
  .progress-pct { font-size: var(--f-sm); }
  .icon-box { border-radius: var(--r-md); }
  .season-indicator { background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .quest-item { background: var(--surface-2); transition: background .22s, border-color .22s, transform .2s var(--ease-out); }

  :root {

    --f-xl: clamp(15px, 1.05vw, 18px);
    --f-2xl: clamp(18px, 1.35vw, 22px);
    --f-3xl: clamp(24px, 2vw, 32px);
    --dur-1: .18s; --dur-2: .28s; --dur-3: .45s; --dur-4: .7s;
    --ease-spring: cubic-bezier(.34, 1.46, .64, 1);

  /* живой фон — общий слой для body и тулбара (совпадает при background-attachment: fixed) */

  /* аккуратные скроллбары (только на ПК) */
  @media (hover: hover) and (pointer: fine) {
    ::-webkit-scrollbar { display: block; width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }
  }

  /* стеклянные поверхности */
  .hud, .bottom-nav {
    backdrop-filter: blur(30px) saturate(190%);
    -webkit-backdrop-filter: blur(30px) saturate(190%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.07);
    position: relative; overflow: hidden;
  }
  .hud::after, .bottom-nav::after {
    content: ''; position: absolute; top: 0; left: 14%; right: 14%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
    pointer-events: none;
  }
  .hud { animation: fadeUp .5s var(--ease-out) backwards; }

  /* заголовки секций */
  .section-title {
    position: relative; padding-left: 13px; letter-spacing: .1em;
    animation: fadeUp .45s var(--ease-out) backwards;
  }
  .section-title::before {
    content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 3px; height: 15px; border-radius: 3px;
    background: linear-gradient(180deg, var(--primary), var(--pink));
  }

  /* карточки: акцент сверху, плавный hover */
  .card::after {
    content: ''; position: absolute; top: 0; left: 14%; right: 14%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.16), transparent);
    pointer-events: none;
  }
  .card.hot::after { background: linear-gradient(90deg, transparent, rgba(251,113,133,.45), transparent); }
  /* пульсация через opacity верхней линии — не перерисовываем тень у каждой карточки */
  .card.hot.pulse::after { animation: hotGlow 2.6s ease-in-out infinite 1s; }
  @keyframes hotGlow {
    0%, 100% { opacity: .35; }
    50%      { opacity: 1; }
  }

  /* плитки и списки */
  .stat-mini, .ach, .rec-row, .quest-item {
    animation: fadeUp .45s var(--ease-out) backwards;
    transition: transform .2s var(--ease-out), background .22s, border-color .22s, box-shadow .25s;
  }
  @media (hover: hover) {
    .stat-mini:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: var(--shadow); }
    .ach:hover { transform: translateY(-3px) scale(1.02); }
    .ach.unlocked:hover { box-shadow: 0 0 0 2px var(--yellow), 0 8px 24px rgba(251,191,36,.22); }
    .rec-row:hover, .quest-item:hover { background: var(--surface-3); }
  }
  .ach.unlocked { animation: fadeUp .45s var(--ease-out) backwards, achPop .6s var(--ease-spring) .1s backwards; }
  @keyframes achPop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }

  /* цели / сюжеты / подсказки */
  .goal-card, .story-card, .tutorial-card, .onboarding-tip, .season-indicator, .auction-card, .rank-card, .empty, .lock-note {
    animation: fadeUp .5s var(--ease-out) backwards;
  }
  .story-card { position: relative; overflow: hidden; }
  .story-card::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(115deg, transparent 35%, rgba(251,191,36,.16) 50%, transparent 65%);
    background-size: 260% 100%;
    transform: translateX(-25%);
    animation: sheen 5.5s ease-in-out infinite;
  }
  @keyframes sheen { 0% { transform: translateX(-25%); } 55%, 100% { transform: translateX(25%); } }
  .goal-card { position: relative; overflow: hidden; }

  /* кнопки */
  button {
    transition: transform .16s var(--ease-out), box-shadow .25s, filter .2s, background .2s, border-color .2s, opacity .2s;
  }
  button:active:not(:disabled) { transform: scale(.965); }
  .btn-primary { box-shadow: 0 6px 22px -8px var(--primary), inset 0 1px 0 rgba(255,255,255,.2); }
  .btn-buy     { box-shadow: 0 6px 22px -8px var(--green), inset 0 1px 0 rgba(255,255,255,.2); }
  .btn-sell    { box-shadow: 0 6px 22px -8px var(--primary), inset 0 1px 0 rgba(255,255,255,.2); }
  .btn-danger  { box-shadow: 0 6px 22px -8px var(--red), inset 0 1px 0 rgba(255,255,255,.2); }
  .btn-ghost   { transition: background .2s, color .2s, border-color .2s, transform .16s var(--ease-out); }

  .meta-chip, .side-pill, .tag, .filter-btn, .sort-btn, .rep-tier, .dev-ico {

  /* прогресс-бары со свечением */
  .progress-fill, .xp-fill { box-shadow: 0 0 14px -2px var(--primary); }
  .xp-fill { box-shadow: 0 0 12px -2px var(--pink); }

  /* иконки товаров */
  .emoji-box {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), var(--shadow-sm);
    transition: transform .25s var(--ease-out), box-shadow .25s;
  }
  @media (hover: hover) { .card:hover .emoji-box { transform: scale(1.05) rotate(-2deg); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), var(--shadow); } }

  /* навигация */
  .nav-btn { transition: color .22s, transform .22s var(--ease-out); }
  @media (hover: hover) { .nav-btn:hover { color: var(--text); } .nav-btn:active { transform: scale(.94); } }
  .nav-ico { transition: transform .32s var(--ease-spring); }
  @media (hover: hover) { .nav-btn:hover .nav-ico { transform: translateY(-2px) scale(1.08); } }

  /* поле поиска */
  .search-box { transition: border-color .25s, box-shadow .25s, background .25s; }
  .search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

  /* модалки */
  .sheet { box-shadow: 0 -10px 50px rgba(0,0,0,.45); }
  .modal { animation: fadeIn .18s ease; }
  .sheet h2 { animation: fadeUp .35s var(--ease-out) backwards; }
  .sheet > * { animation: fadeUp .4s var(--ease-out) backwards; }

  /* поле ввода кредита, текстуры */
  input[type="number"], .sync-box { transition: border-color .25s, box-shadow .25s; }
  input[type="number"]:focus, .sync-box:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); outline: none; }

  /* мини-игра */
  .mg-cursor { box-shadow: 0 0 22px var(--primary); animation: cursorGlow 1.6s ease-in-out infinite; }
  @keyframes cursorGlow { 0%, 100% { opacity: 1; } 50% { opacity: .78; } }
  .mg-zone-perfect { animation: zoneGlow 2.2s ease-in-out infinite; }
  @keyframes zoneGlow { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }
  .mg-dot { transition: transform .25s var(--ease-spring), background .25s; }

  .msg-bubble { transition: transform .2s var(--ease-out), box-shadow .25s; }

  /* пустые состояния */
  .empty { position: relative; }
  .empty::before {

  /* каскад для прямых потомков панели */
  .panel > * { animation: fadeUp .48s var(--ease-out) backwards; }
  .panel > *:nth-child(1) { animation-delay: .02s; }
  .panel > *:nth-child(2) { animation-delay: .07s; }

/* синхронизирует список с массивом items: новые — создаются,
   изменившиеся — обновляются на месте, лишние — удаляются */
function syncList(hostId, listId, items, renderItem, emptyHTML) {
  const host = document.getElementById(hostId);
  if (!host) return;
  const el = listEl(listId);
  if (!items.length) {
    el.innerHTML = emptyHTML || '';
    el._html = emptyHTML || '';
    if (el.parentElement !== host) host.appendChild(el);
    return;
  }
  const old = new Map();
  for (const ch of Array.from(el.children)) {
    if (ch.dataset.key) old.set(ch.dataset.key, ch);
    else ch.remove(); /* убираем заглушку «ничего не найдено» */
  }
  const order = [];
  for (const it of items) {
    const key = String(it.id);
    const html = renderItem(it);
    let node = old.get(key);
    if (node) {
      old.delete(key);
      if (node._html !== html) { node.innerHTML = html; node._html = html; }
    } else {
      node = document.createElement('div');
      node.dataset.key = key;
      node._html = html;
      node.innerHTML = html;

function revealVisibleCards() {

function setupReveal() {

let moneyAnimId = null;
function animateMoney(newValue) {
  const from = displayMoney, to = newValue;
  const diff = to - from;
  if (Math.abs(diff) < 50) {
    displayMoney = to;
    const el = $('moneyChipVal');
    if (el) el.textContent = fmt(to);
    return;
  }
  if (moneyAnimId) cancelAnimationFrame(moneyAnimId);
  const start = performance.now(), duration = 600;
  const el = $('moneyChipVal');
  if (!el) return;
  const step = (now) => {
    const tt = Math.min(1, (now - start) / duration);
    const ease = 1 - Math.pow(1 - tt, 3);
    displayMoney = from + diff * ease;
    const txt = fmt(displayMoney);
    if (el.textContent !== txt) el.textContent = txt;
    if (tt < 1) moneyAnimId = requestAnimationFrame(step);
    else { displayMoney = to; el.textContent = fmt(to); moneyAnimId = null; }
  };
  moneyAnimId = requestAnimationFrame(step);
}

function makeLot(forceTier, black) {
  const pool = ITEMS.filter(repAllowsItem);
  const t = pick(pool.length ? pool : ITEMS);
  const condition = rnd(0.55, 1.0);
  const seasonMult = currentSeason().mods[t.cat] || 1;
  let tier = forceTier || 'common';
  if (!forceTier) {
    if (S.transport >= 2 && Math.random() < 0.03) tier = 'premium';
    else if (S.transport >= 1 && Math.random() < 0.08) tier = 'rare';
  }
  const tierMult = tier === 'premium' ? 2.5 : tier === 'rare' ? 1.5 : 1;
  const marketValue = round100(t.base * condition * seasonMult * tierMult);
  const defect = Math.random() < 0.18;
  let trueValue = defect ? round100(marketValue * 0.55) : marketValue;
  let askPrice = round100(marketValue * rnd(0.58, 0.9));
  if (!black) askPrice = round100(askPrice * (1 - supplierDiscount()));
  if (S.event && S.event.effect === 'cheapMarket') askPrice = round100(askPrice * S.event.mult);
  let story = null;
  if (tier === 'common' && Math.random() < 0.25) { story = pick(STORIES); askPrice = round100(askPrice * story.priceMult); trueValue = round100(trueValue * story.trueMult); }
  const isBlack = !!(story && story.risk);
  const scamChance = isBlack ? story.risk : 0;
  let estimate = round100(marketValue * rnd(0.88, 1.12));
  if (S.skills.inspect >= 2) estimate = round100(marketValue * rnd(0.94, 1.06));
  updatePriceHistory(t.id, marketValue);
  const stock = ri(1, 3);
  return { id: ++idc, itemId: t.id, name: t.name, emoji: t.emoji, slug: t.slug, cat: t.cat, condition, marketValue, trueValue, defect, askPrice, estimate, stock, inspected: false, tier, story, isBlack, scamChance, brand: t.brand, icon: t.icon };
}
function makeOrder() {
  if (S.orders.filter(o => !o.done && !o.failed).length >= 3) return;
  /* заказы только на доступные товары — иначе заказ может быть невыполнимым */
  const pool = ITEMS.filter(repAllowsItem);
  const t = pick(pool.length ? pool : ITEMS);
  const bonus = rnd(0.15, 0.30);
  const baseValue = round100(t.base * rnd(0.9, 1.1));
  S.orders.push({ id: ++idc, itemId: t.id, name: t.name, emoji: t.emoji, slug: t.slug, icon: t.icon || ICON_FIX[t.slug], reward: round100(baseValue * (1 + bonus)), deadline: S.day + ri(3, 5), bonus: Math.round(bonus * 100), done: false, failed: false });
}
function makePallet() {
  if (!S || S.transport < 3) return;
  const freeSlots = invLimit() - S.inv.length;
  const size = Math.min(ri(3, 6), Math.max(1, freeSlots));
  if (size < 1) return;
  const price = round100(size * 5000 * rnd(0.6, 0.9));
  S.pallet = { price, size, day: S.day };
}
function expandMarket() {
  const target = marketSize();
  let added = 0;
  while (S.market.length < target) { S.market.push(makeLot()); added++; }
  return added;
}
function newMarket() {
  S.dailyDemand = Math.random() < 0.6 ? { cat: pick(['tech', 'home', 'sport', 'hobby', 'fashion']), mult: rnd(1.15, 1.4) } : null;
  const target = marketSize();
  const keep = S.market.slice(0, Math.max(1, Math.floor(S.market.length / 2)));
  const fresh = [];
  while (keep.length + fresh.length < target) fresh.push(makeLot());
  S.market = keep.concat(fresh);
  S.auction = null;
  if (S.day % 7 === 0 && S.day > 0) {
    const rareItem = pick(ITEMS.filter(i => i.base > 50000));
    const aucItem = makeLot('premium');
    aucItem.itemId = rareItem.id; aucItem.name = rareItem.name; aucItem.emoji = rareItem.emoji; aucItem.slug = rareItem.slug;
    aucItem.icon = rareItem.icon || rareItem.slug; aucItem.brand = rareItem.brand || '';
    aucItem.askPrice = Math.round(aucItem.marketValue * 0.5); aucItem.stock = 1;
    S.auction = { item: aucItem, currentBid: aucItem.askPrice, botMax: round100(aucItem.marketValue * 1.2), active: true };
  }
  newBlackMarket();
}

function unlockAch(id) {
  if (S.achievements[id]) return;
  S.achievements[id] = true;
  const a = ACHIEVEMENTS.find(x => x.id === id);
  if (!a) return;
  S.skillPoints += a.points;
  const rw = ACH_REWARDS[id];
  if (rw && rw.money) { S.money += rw.money; S.stats.totalEarned += rw.money; }
  toast(`🏅 ${nm(a.name)} · +${a.points} SP${rw && rw.money ? ' · +' + fmt(rw.money) : ''}`, 'success');
  playSound('ach'); haptic(30);
  checkRich();
}
function checkAch() {
  const st = S.stats;
  /* пойманный тренд — тот же товар, чья цена изменилась больше чем на 15% */
  const trendCaught = Object.keys(S.priceHistory || {}).some(id => {
    const h = S.priceHistory[id];
    if (!h || h.length < 3 || !h[0]) return false;
    return Math.abs((h[h.length - 1] - h[0]) / h[0] * 100) >= 15;
  });
  const checks = [
    [st.deals >= 1, 'first_sale'], [st.deals >= 10, 'ten_sales'], [st.deals >= 50, 'fifty_sales'], [st.deals >= 100, 'hundred_sales'],
    [st.bestDeal >= 30000, 'big_deal'], [st.cleanStreak >= 5, 'no_defects_5'], [st.ordersDone >= 1, 'first_order'],
    [S.money >= 1000000, 'million'], [S.rep >= 100, 'rep_max'], [bizLevel() >= 2, 'biz2'], [bizLevel() >= 4, 'biz4'], [S.prestige > 0, 'prestige1'],
    [trendCaught, 'trends']
  ];
  for (const [cond, id] of checks) if (cond) unlockAch(id);
}

let _fmCache = { key: '', items: [] };
function getFilteredMarket() {
  let sum = 0;
  for (const l of S.market) sum += l.askPrice || 0;
  /* в ключ входят id первого и последнего лота: список мог смениться при той же длине и сумме */
  const firstId = S.market.length ? S.market[0].id : 0;
  const lastId = S.market.length ? S.market[S.market.length - 1].id : 0;
  const key = [S.filter, S.sortBy, S.search || '', S.market.length, sum, firstId, lastId].join('|');
  if (_fmCache.key === key) return _fmCache.items;
  let items = S.market.filter(it => S.filter === 'all' || it.cat === S.filter);
  if (S.search && S.search.trim()) {
    const q = S.search.toLowerCase().trim();
    items = items.filter(it => {
      const name = itemName(it).toLowerCase();
      return name.includes(q) || (it.cat || '').toLowerCase().includes(q);
    });
  }
  if (S.sortBy === 'price_asc') items.sort((a, b) => a.askPrice - b.askPrice);
  else if (S.sortBy === 'price_desc') items.sort((a, b) => b.askPrice - a.askPrice);
  else if (S.sortBy === 'pot') items.sort((a, b) => (b.estimate - b.askPrice) - (a.estimate - a.askPrice));
  _fmCache = { key, items };
  return items;
}

let _sparkId = 0;
function sparkline(hist) {
  if (!hist || hist.length < 3) return '';
  const w = 84, h = 26;
  const max = Math.max.apply(null, hist), min = Math.min.apply(null, hist);
  const span = Math.max(1, max - min);
  const pts = hist.map((v, i) => [(i / (hist.length - 1)) * w, h - 3 - ((v - min) / span) * (h - 7)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = d + ' L ' + w + ' ' + h + ' L 0 ' + h + ' Z';
  /* уникальный id: иначе несколько графиков на странице делят один градиент */
  const gid = 'sg' + (++_sparkId);
  const up = pts[pts.length - 1][1] <= pts[0][1];
  const col = up ? 'var(--green)' : 'var(--red)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${col}" stop-opacity=".32"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function priceTrend(itemId) {
  const h = (S.priceHistory || {})[itemId];
  if (!h || h.length < 2) return { pct: 0, hist: [] };
  const last = h[h.length - 1], prev = h[h.length - 2];
  const pct = prev ? Math.round((last - prev) / prev * 100) : 0;
  return { pct, hist: h.slice(-8) };
}
